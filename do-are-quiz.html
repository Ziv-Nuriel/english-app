<title>Do or Are Drill</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f6f3ec;
    --ink: #2b2a28;
    --ink-soft: #6b6558;
    --rule: #d8d2c4;
    --card: #fffefb;
    --accent: #1f6f78;
    --accent-soft: #e3eeee;
    --highlight: #d99a2b;
    --correct: #2f7d4f;
    --correct-bg: #e3f2e6;
    --wrong: #b3432b;
    --wrong-bg: #fbe8e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1c1b18;
      --ink: #ece7dc;
      --ink-soft: #a49c8a;
      --rule: #3a382f;
      --card: #23221e;
      --accent: #6bc2cb;
      --accent-soft: #1e3336;
      --highlight: #e8b23d;
      --correct: #7bc99a;
      --correct-bg: #1c3324;
      --wrong: #e08a6c;
      --wrong-bg: #3a2019;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1b18;
    --ink: #ece7dc;
    --ink-soft: #a49c8a;
    --rule: #3a382f;
    --card: #23221e;
    --accent: #6bc2cb;
    --accent-soft: #1e3336;
    --highlight: #e8b23d;
    --correct: #7bc99a;
    --correct-bg: #1c3324;
    --wrong: #e08a6c;
    --wrong-bg: #3a2019;
  }
  :root[data-theme="light"] {
    --paper: #f6f3ec;
    --ink: #2b2a28;
    --ink-soft: #6b6558;
    --rule: #d8d2c4;
    --card: #fffefb;
    --accent: #1f6f78;
    --accent-soft: #e3eeee;
    --highlight: #d99a2b;
    --correct: #2f7d4f;
    --correct-bg: #e3f2e6;
    --wrong: #b3432b;
    --wrong-bg: #fbe8e3;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 3rem 1rem;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 620px; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: .6rem;
    margin-bottom: .35rem;
  }
  .masthead h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: .01em;
  }
  .masthead .level {
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .sub {
    color: var(--ink-soft);
    font-size: .88rem;
    margin: .6rem 0 1.75rem;
    direction: rtl;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: .4rem;
    font-size: .8rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .progress-row strong { color: var(--ink); font-weight: 700; }
  .bar {
    width: 100%;
    height: 4px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.75rem;
  }
  .bar-fill {
    height: 100%;
    background: var(--highlight);
    transition: width .35s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2rem 1.75rem;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 1.75rem; right: 1.75rem;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px);
  }

  .sentence {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.4rem;
    line-height: 1.65;
    margin: .5rem 0 1.75rem;
  }
  .blank {
    display: inline-block;
    min-width: 84px;
    border-bottom: 2px solid var(--highlight);
    text-align: center;
    font-weight: 700;
    color: var(--highlight);
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .65rem;
  }
  .opt {
    padding: .75rem 1rem;
    border-radius: 3px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.05rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    text-align: center;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .opt:disabled { cursor: default; }
  .opt.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 700;
  }
  .opt.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
    font-weight: 700;
  }

  .hint {
    margin-top: 1.1rem;
    font-size: .85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }
  .hint .why {
    display: block;
    margin-top: .35rem;
    color: var(--ink-soft);
    direction: rtl;
    text-align: right;
  }

  .order-label {
    font-size: .78rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 .6rem;
  }
  .order-build {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    min-height: 3.2rem;
    padding: .75rem;
    border: 1.5px dashed var(--rule);
    border-radius: 4px;
    margin-bottom: 1.1rem;
    align-items: center;
  }
  .order-build.empty::before {
    content: "Tap the words below to build the sentence";
    color: var(--ink-soft);
    font-size: .82rem;
  }
  .order-build.correct { border-style: solid; border-color: var(--correct); }
  .order-build.wrong { border-style: solid; border-color: var(--wrong); }
  .order-bank {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .chip {
    padding: .55rem .9rem;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1rem;
    cursor: pointer;
    transition: transform .12s ease, border-color .15s, background .15s, opacity .15s;
  }
  .chip:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-2px);
  }
  .chip:active:not(:disabled) { transform: scale(.94); }
  .chip:disabled { opacity: .3; cursor: default; }
  .chip.placed {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .order-build.correct .chip.placed {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
  }
  .order-build.wrong .chip.placed {
    border-color: var(--wrong);
    background: var(--wrong-bg);
    color: var(--wrong);
  }

  .footer-row {
    margin-top: 1.5rem;
    display: flex;
    justify-content: flex-end;
  }
  button.next {
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: .65rem 1.35rem;
    border-radius: 3px;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  button.next.show { opacity: 1; pointer-events: auto; }
  button.next:focus-visible,
  .opt:focus-visible,
  button.restart:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .result { text-align: center; }
  .result .level { display: block; margin-bottom: .5rem; }
  .score {
    font-family: Georgia, serif;
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin: .25rem 0;
  }
  .result p {
    color: var(--ink-soft);
    font-size: .95rem;
  }
  button.restart {
    margin-top: 1rem;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    padding: .65rem 1.35rem;
    border-radius: 3px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill, button.next { transition: none; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <h1>Do or Are Drill</h1>
    <span class="level" id="levelTag">INTERMEDIATE</span>
  </div>
  <div class="sub">בחרו Do או Are: משתמשים ב-Are לפני שם/תואר/מקום (הפועל to be), וב-Do כשיש פועל פעולה נוסף במשפט</div>

  <div class="progress-row">
    <span>Question <strong id="qnum">1</strong> of <strong id="qtotal">15</strong></span>
    <span>Score: <strong id="scorelive">0</strong></span>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>

  <div class="card" id="quizCard"></div>
</div>

<script>
const questions = [
  { sentence: "___ you a teacher?", answer: "Are", options: ["Are", "Do"] },
  { sentence: "___ you like pizza?", answer: "Do", options: ["Do", "Are"] },
  { sentence: "___ they students at this school?", answer: "Are", options: ["Are", "Do"] },
  { sentence: "___ they study English every day?", answer: "Do", options: ["Do", "Are"] },
  { sentence: "___ you happy with the results?", answer: "Are", options: ["Are", "Do"] },
  { sentence: "___ you work on weekends?", answer: "Do", options: ["Do", "Are"] },
  { sentence: "___ your parents at home right now?", answer: "Are", options: ["Are", "Do"] },
  { sentence: "___ your parents watch the news together?", answer: "Do", options: ["Do", "Are"] },
  { sentence: "___ we ready to go?", answer: "Are", options: ["Are", "Do"] },
  { sentence: "___ we need to bring anything?", answer: "Do", options: ["Do", "Are"] },
  { sentence: "___ you tired after the trip?", answer: "Are", options: ["Are", "Do"] },
  { sentence: "___ you usually walk to work?", answer: "Do", options: ["Do", "Are"] },
  { sentence: "___ these shoes comfortable?", answer: "Are", options: ["Are", "Do"] },
  { sentence: "___ these shoes fit you well?", answer: "Do", options: ["Do", "Are"] },
  { sentence: "___ you and your brother close in age?", answer: "Are", options: ["Are", "Do"] },
  { type: "order", answer: ["are", "you", "hungry"], punct: "?", why: "אין פועל פעולה נוסף אחרי Are (רק תואר), לכן Are פותח את המשפט." },
  { type: "order", answer: ["do", "you", "work", "on", "weekends"], punct: "?", why: "\"work\" הוא פועל פעולה, לכן צריך את Do בתחילת המשפט." },
  { type: "order", answer: ["are", "your", "parents", "at", "home"], punct: "?", why: "אחרי Are מגיע ביטוי מקום (at home), אין פועל פעולה נוסף." },
  { type: "order", answer: ["do", "these", "shoes", "fit", "you"], punct: "?", why: "\"fit\" הוא פועל פעולה, לכן Do." },
  { type: "order", answer: ["are", "you", "and", "your", "brother", "close", "in", "age"], punct: "?", why: "אחרי Are מגיע תיאור (close in age), אין פועל פעולה נוסף." }
];

let current = 0;
let score = 0;

let audioCtx = null;
function playTone(freqStart, freqEnd, duration, type, gainStart) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainStart, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playCorrectSound() {
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((freq, i) => {
    setTimeout(() => playTone(freq, freq * 1.01, 0.18, "triangle", 0.2), i * 70);
  });
}

function playWrongSound() {
  playTone(220, 110, 0.32, "sawtooth", 0.15);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  const card = document.getElementById("quizCard");
  document.getElementById("qnum").textContent = current + 1;
  document.getElementById("qtotal").textContent = questions.length;
  document.getElementById("scorelive").textContent = score;
  document.getElementById("barFill").style.width = `${(current / questions.length) * 100}%`;

  if (current >= questions.length) {
    document.getElementById("levelTag").textContent = "COMPLETE";
    const verdict = score === questions.length
      ? "Perfect! Full mastery of Do vs. Are."
      : score >= questions.length * 0.7
      ? "Great job — very good performance!"
      : "Not bad — practice again to reinforce it.";
    card.innerHTML = `
      <div class="result">
        <span class="level">INTERMEDIATE</span>
        <div>You finished the drill</div>
        <div class="score">${score} / ${questions.length}</div>
        <p>${verdict}</p>
        <button class="restart" onclick="restart()">Start Over</button>
      </div>`;
    document.getElementById("barFill").style.width = "100%";
    return;
  }

  const q = questions[current];

  if (q.type === "order") {
    card.innerHTML = `
      <div class="order-label">Arrange the words into the correct sentence</div>
      <div class="order-build empty" id="orderBuild"></div>
      <div class="order-bank" id="orderBank"></div>
      <div class="hint" id="hint"></div>
      <div class="footer-row"><button class="next" id="nextBtn">Next →</button></div>
    `;
    renderOrderQuestion(q);
    return;
  }

  const opts = shuffle(q.options);

  card.innerHTML = `
    <div class="sentence">${q.sentence.replace("___", '<span class="blank">____</span>')}</div>
    <div class="options">
      ${opts.map(o => `<button class="opt" data-value="${o}">${o}</button>`).join("")}
    </div>
    <div class="hint" id="hint"></div>
    <div class="footer-row"><button class="next" id="nextBtn">Next →</button></div>
  `;

  card.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => selectAnswer(btn, q.answer));
  });
}

function renderOrderQuestion(q) {
  let placed = [];
  const shuffled = shuffle(q.answer.map((w, i) => ({ w, i })));
  if (q.answer.length > 1 && shuffled.every((item, idx) => item.i === idx)) {
    [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
  }

  function draw() {
    const buildEl = document.getElementById("orderBuild");
    const bankEl = document.getElementById("orderBank");
    buildEl.classList.toggle("empty", placed.length === 0);
    buildEl.innerHTML = placed.map(p => `<button class="chip placed" data-i="${p.i}">${p.w}</button>`).join("");
    bankEl.innerHTML = shuffled.map(item => {
      const used = placed.some(p => p.i === item.i);
      return `<button class="chip" data-i="${item.i}" ${used ? "disabled" : ""}>${item.w}</button>`;
    }).join("");

    buildEl.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        placed = placed.filter(p => p.i !== Number(btn.dataset.i));
        draw();
      });
    });
    bankEl.querySelectorAll(".chip:not(:disabled)").forEach(btn => {
      btn.addEventListener("click", () => {
        placed.push(shuffled.find(s => s.i === Number(btn.dataset.i)));
        draw();
        if (placed.length === q.answer.length) checkOrder();
      });
    });
  }

  function checkOrder() {
    const buildEl = document.getElementById("orderBuild");
    const userOrder = placed.map(p => p.w);
    const isCorrect = JSON.stringify(userOrder) === JSON.stringify(q.answer);
    buildEl.classList.add(isCorrect ? "correct" : "wrong");
    buildEl.querySelectorAll(".chip").forEach(b => b.disabled = true);
    document.getElementById("orderBank").querySelectorAll(".chip").forEach(b => b.disabled = true);

    const sentence = q.answer.join(" ");
    const proper = sentence.charAt(0).toUpperCase() + sentence.slice(1) + q.punct;
    document.getElementById("hint").innerHTML = isCorrect
      ? `Correct! <strong>${proper}</strong>`
      : `Almost — the correct order is: <strong>${proper}</strong>${q.why ? `<span class="why">${q.why}</span>` : ""}`;

    if (isCorrect) { score++; playCorrectSound(); }
    else { playWrongSound(); }
    document.getElementById("scorelive").textContent = score;
    document.getElementById("nextBtn").classList.add("show");
    document.getElementById("nextBtn").onclick = () => {
      current++;
      render();
    };
  }

  draw();
}

function selectAnswer(btn, correctAnswer) {
  const buttons = document.querySelectorAll(".opt");
  const isCorrect = btn.dataset.value === correctAnswer;

  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.value === correctAnswer) b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
  });

  document.getElementById("hint").textContent = isCorrect
    ? "Correct!"
    : `Not quite — the correct answer is "${correctAnswer}".`;

  if (isCorrect) score++;
  document.getElementById("scorelive").textContent = score;
  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("nextBtn").onclick = () => {
    current++;
    render();
  };
}

function restart() {
  current = 0;
  score = 0;
  document.getElementById("levelTag").textContent = "INTERMEDIATE";
  render();
}

render();
</script>
