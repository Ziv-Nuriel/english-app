<title>Question Words Drill</title>
<style>

    --card: #fffefb;
    --accent: #1f6f78;
    --accent-soft: #e3eeee;
    --highlight: #d99a2b;

      --card: #23221e;
      --accent: #6bc2cb;
      --accent-soft: #1e3336;
      --highlight: #e8b23d;
      --correct: #7bc99a;
      --correct-bg: #1c3324;
      --wrong: #e08a6c;

  }
  :root[data-theme="dark"] {
    --paper: #1c1b18;
    --ink: #ece7dc;
    --ink-soft: #a49c8a;
    --rule: #3a382f;
    --card: #23221e;
    --accent: #6bc2cb;
    --accent-soft: #1e3336;
    --highlight: #e8b23d;
    --correct: #7bc99a;
    --correct-bg: #1c3324;
    --wrong: #e08a6c;
    --wrong-bg: #3a2019;
  }
  :root[data-theme="light"] {
    --paper: #f6f3ec;
    --ink: #2b2a28;
    --ink-soft: #6b6558;
    --rule: #d8d2c4;
    --card: #fffefb;
    --accent: #1f6f78;
    --accent-soft: #e3eeee;
    --highlight: #d99a2b;
    --correct: #2f7d4f;
    --correct-bg: #e3f2e6;
    --wrong: #b3432b;
    --wrong-bg: #fbe8e3;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 3rem 1rem;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 620px; }

  .masthead {
    display: flex;

    padding-bottom: .6rem;
    margin-bottom: .35rem;
  }
  .masthead h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: .01em;
  }
  .masthead .level {
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .sub {
    color: var(--ink-soft);
    font-size: .88rem;
    margin: .6rem 0 1.25rem;
    direction: rtl;
  }

  .legend {
    background: var(--accent-soft);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: .85rem 1rem;
    margin-bottom: 1.25rem;
    font-size: .82rem;
    line-height: 1.7;
    color: var(--ink);
    direction: rtl;
  }
  .legend strong { color: var(--accent); }

  .stage-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin-bottom: 1.5rem;
  }
  .stage-tab {
    padding: .4rem .95rem;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .stage-tab:hover { border-color: var(--accent); color: var(--accent); }
  .stage-tab.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: .4rem;
    font-size: .8rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .progress-row strong { color: var(--ink); font-weight: 700; }
  .bar {
    width: 100%;
    height: 4px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.75rem;
  }
  .bar-fill {
    height: 100%;
    background: var(--highlight);
    transition: width .35s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2rem 1.75rem;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 1.75rem; right: 1.75rem;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px);
  }

  .sentence {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.4rem;
    line-height: 1.65;
    margin: .5rem 0 1.75rem;
  }
  .blank {
    display: inline-block;
    min-width: 84px;
    border-bottom: 2px solid var(--highlight);
    text-align: center;
    font-weight: 700;
    color: var(--highlight);
  }

  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: .65rem;
  }
  .opt {
    padding: .75rem 1rem;
    border-radius: 3px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.05rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    text-align: center;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .opt:disabled { cursor: default; }
  .opt.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 700;
  }
  .opt.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
    font-weight: 700;
  }

  .hint {
    margin-top: 1.1rem;
    font-size: .85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }
  .hint .why {
    display: block;
    margin-top: .35rem;
    color: var(--wrong);
    direction: rtl;
    text-align: right;
  }

  .sub-tabs {
    display: flex;
    gap: .5rem;
    margin-bottom: 1.25rem;
  }
  .sub-tab {
    flex: 1;
    padding: .5rem .75rem;
    border-radius: 4px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .sub-tab:hover { border-color: var(--accent); color: var(--accent); }
  .sub-tab.active {
    border-color: var(--highlight);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .translate-prompt {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.3rem;
    line-height: 1.6;
    margin: .5rem 0 1.5rem;
    padding: 1rem 1.25rem;
    background: var(--accent-soft);
    border-radius: 4px;
  }

  .dialogue-scenario {
    font-style: italic;
    color: var(--ink-soft);
    direction: rtl;
    text-align: right;
    font-size: .92rem;
    margin: 0 0 1rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--rule);
  }
  .dialogue-log {
    display: flex;
    flex-direction: column;
    gap: .6rem;
  }
  .dialogue-log:not(:empty) {
    margin-bottom: 1rem;
  }
  .dialogue-msg {
    max-width: 80%;
    padding: .6rem .9rem;
    border-radius: 14px;
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: .95rem;
    line-height: 1.4;
    direction: ltr;
    text-align: left;
  }
  .speak-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: .85rem;
    padding: 0 0 0 .3rem;
    opacity: .6;
    vertical-align: middle;
  }
  .speak-btn:hover {
    opacity: 1;
  }
  .dialogue-msg.you {
    align-self: flex-end;
    background: var(--accent-soft);
    color: var(--accent);
    border-bottom-right-radius: 3px;
  }
  .dialogue-msg.them {
    align-self: flex-start;
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-bottom-left-radius: 3px;
    margin-bottom: 1rem;
  }
  .dialogue-cue {
    font-size: .85rem;
    color: var(--ink-soft);
    direction: rtl;
    text-align: right;
    margin-bottom: .6rem;
  }
  .translate-input {
    width: 100%;
    padding: .75rem 1rem;
    border-radius: 3px;
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.05rem;
    margin-bottom: 1rem;
  }
  .translate-input:focus { outline: none; border-color: var(--accent); }
  .translate-input:disabled { opacity: .8; }
  .translate-input.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
  }
  .translate-input.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
    color: var(--wrong);
  }

  .order-label {
    font-size: .78rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 .6rem;
    direction: rtl;
  }
  .order-build {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    min-height: 3.2rem;
    padding: .75rem;
    border: 1.5px dashed var(--rule);
    border-radius: 4px;
    margin-bottom: 1.1rem;
    align-items: center;
  }
  .order-build.empty::before {
    content: "Tap the words below to build the sentence";
    color: var(--ink-soft);
    font-size: .82rem;
  }
  .order-build.correct { border-style: solid; border-color: var(--correct); }
  .order-build.wrong { border-style: solid; border-color: var(--wrong); }
  .order-bank {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .chip {
    padding: .55rem .9rem;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1rem;
    cursor: pointer;
    transition: transform .12s ease, border-color .15s, background .15s, opacity .15s;
  }
  .chip:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-2px);
  }
  .chip:active:not(:disabled) { transform: scale(.94); }
  .chip:disabled { opacity: .3; cursor: default; }
  .chip.placed {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .order-build.correct .chip.placed {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
  }
  .order-build.wrong .chip.placed {
    border-color: var(--wrong);
    background: var(--wrong-bg);
    color: var(--wrong);
  }

  .footer-row {
    margin-top: 1.5rem;
    display: flex;
    justify-content: flex-end;
  }
  button.next {
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: .65rem 1.35rem;
    border-radius: 3px;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  button.next.show { opacity: 1; pointer-events: auto; }
  button.next:focus-visible,
  .opt:focus-visible,
  button.restart:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .result { text-align: center; }
  .result .level { display: block; margin-bottom: .5rem; }
  .score {
    font-family: Georgia, serif;
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin: .25rem 0;
  }
  .result p {
    color: var(--ink-soft);
    direction: rtl;
    font-size: .95rem;
  }
  button.restart {
    margin-top: 1rem;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    padding: .65rem 1.35rem;
    border-radius: 3px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill, button.next { transition: none; }
  }
</style>

<div class="wrap">

const DIALOGUE_API_URL = ""; // paste your deployed Cloudflare Worker URL here to enable AI-powered replies

async function getDialogueResponse(stage, log, message) {
  if (!DIALOGUE_API_URL) return null;
  try {
    const resp = await fetch(DIALOGUE_API_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ scenario: stage.dialogueScenario, grammarFocus: stage.title, history: log, message })
    });
    if (!resp.ok) return null;
    const data = await resp.json();
    if (typeof data.grammar_ok !== "boolean" || typeof data.reply !== "string") return null;
    return { ok: data.grammar_ok, note: data.note || "", reply: data.reply };
  } catch (e) {
    return null;
  }
}

let audioCtx = null;
function playTone(freqStart, freqEnd, duration, type, gainStart) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainStart, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playCorrectSound() {
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((freq, i) => {
    setTimeout(() => playTone(freq, freq * 1.01, 0.18, "triangle", 0.2), i * 70);
  });
}

function playWrongSound() {
  playTone(220, 110, 0.32, "sawtooth", 0.15);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderTabs() {
  const tabs = document.getElementById("stageTabs");
  tabs.innerHTML = stages
    .map((s, i) => `<button class="stage-tab${i === stageIndex ? " active" : ""}" data-stage="${i}">${i + 1}. ${s.title}</button>`)
    .join("");
  tabs.querySelectorAll(".stage-tab").forEach(btn => {
    btn.addEventListener("click", () => goToStage(Number(btn.dataset.stage)));
  });
}

function goToStage(i) {
  stageIndex = i;
  current = 0;
  render();
}

function render() {
  const card = document.getElementById("quizCard");
  const stage = stages[stageIndex];
  renderTabs();
  document.getElementById("stageTitle").textContent = stage.title;
  document.getElementById("stageSub").textContent = stage.sub;
  document.getElementById("legend").innerHTML = stage.legend;
  document.getElementById("levelTag").textContent = `STAGE ${stageIndex + 1} / ${stages.length}`;

  const sections = getSections(stage);
  renderSubTabs(sections);

  if (current < stage.questions.length) {
    const sec = sections.find(s => current >= s.start && current < s.start + s.len) || sections[sections.length - 1];
    document.getElementById("qnum").textContent = current - sec.start + 1;
    document.getElementById("qtotal").textContent = sec.len;
    document.getElementById("barFill").style.width = `${((current - sec.start) / sec.len) * 100}%`;
  } else {
    document.getElementById("qnum").textContent = stage.questions.length;
    document.getElementById("qtotal").textContent = stage.questions.length;
  }
  document.getElementById("scorelive").textContent = score;

  if (current >= stage.questions.length) {
    const isLastStage = stageIndex === stages.length - 1;
    const totalQuestions = stages.reduce((sum, s) => sum + s.questions.length, 0);

    if (!isLastStage) {
      document.getElementById("levelTag").textContent = `STAGE ${stageIndex + 1} COMPLETE`;
      card.innerHTML = `
        <div class="result">
          <span class="level">Stage ${stageIndex + 1} Complete</span>
          <div>Score so far</div>
          <div class="score">${score} / ${stage.questions.length}</div>
          <p>Ready for the next stage: ${stages[stageIndex + 1].title}</p>
          <button class="restart" onclick="goToStage(${stageIndex + 1})">Next Stage →</button>
        </div>`;
      document.getElementById("barFill").style.width = "100%";
      return;
    }

    document.getElementById("levelTag").textContent = "COMPLETE";
    const verdict = score === totalQuestions
      ? "Perfect! Full mastery of all stages."
      : score >= totalQuestions * 0.7
      ? "Great job — very good performance!"
      : "Not bad — practice again to reinforce it.";
    card.innerHTML = `
      <div class="result">
        <span class="level">INTERMEDIATE</span>
        <div>You finished all the stages</div>
        <div class="score">${score} / ${totalQuestions}</div>
        <p>${verdict}</p>
        <button class="restart" onclick="restart()">Start Over</button>
      </div>`;
    document.getElementById("barFill").style.width = "100%";
    return;
  }

  const q = stage.questions[current];

  if (q.type === "order") {
    card.innerHTML = `
      <div class="order-label">Arrange the words into the correct sentence</div>
      <div class="order-build empty" id="orderBuild"></div>
      <div class="order-bank" id="orderBank"></div>
      <div class="hint" id="hint"></div>
      <div class="footer-row"><button class="next" id="nextBtn">Next →</button></div>
    `;
    renderOrderQuestion(q);
    return;
  }

  if (q.type === "translate") {
    const label = q.direction === "toHebrew" ? "Translate to Hebrew" : "Translate to English";
    const promptDir = q.direction === "toHebrew" ? "ltr" : "rtl";
    const inputDir = q.direction === "toHebrew" ? "rtl" : "ltr";
    card.innerHTML = `
      <div class="order-label">${label}</div>
      <div class="translate-prompt" dir="${promptDir}">${q.prompt}</div>
      <input type="text" class="translate-input" id="translateInput" dir="${inputDir}" autocomplete="off" spellcheck="false" />
      <div class="hint" id="hint"></div>
      <div class="footer-row"><button class="next show" id="checkBtn">Check</button></div>
    `;
    renderTranslateQuestion(q);
    return;
  }

  if (q.type === "dialogue") {
    const sec = sections.find(s => s.label === "Dialogue");
    if (current === sec.start) dialogueLog[stageIndex] = [];
    const log = dialogueLog[stageIndex] || [];
    const liveTurn = q.theyAsk ? [{ who: "them", text: q.theyAsk }] : [];
    card.innerHTML = `
      <div class="dialogue-scenario">${stage.dialogueScenario}</div>
      <div class="dialogue-log">${renderDialogueLog(log.concat(liveTurn))}</div>
      <div class="dialogue-cue"><strong>${q.theyAsk ? "מה לענות:" : "מה להגיד:"}</strong> ${q.instruction}</div>
      <input type="text" class="translate-input" id="translateInput" dir="ltr" autocomplete="off" spellcheck="false" placeholder="${q.theyAsk ? "Answer in English..." : "Type your question in English..."}" />
      <div class="hint" id="hint"></div>
      <div class="footer-row"><button class="next show" id="checkBtn">Check</button></div>
    `;
    renderDialogueQuestion(q, stage);
    return;
  }

  const opts = shuffle(q.options);

  card.innerHTML = `
    <div class="sentence">${q.sentence.replace("___", '<span class="blank">____</span>')}</div>
    <div class="options">
      ${opts.map(o => `<button class="opt" data-value="${o}">${o}</button>`).join("")}
    </div>
    <div class="hint" id="hint"></div>
    <div class="footer-row"><button class="next" id="nextBtn">Next →</button></div>
  `;

  card.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => selectAnswer(btn, q));
  });
}

function getSections(stage) {
  const mcCount = typeof stage.mcCount === "number" ? stage.mcCount : stage.questions.length;
  const orderCount = typeof stage.orderCount === "number" ? stage.orderCount : 0;
  const dialogueCount = typeof stage.dialogueCount === "number" ? stage.dialogueCount : 0;
  const translateCount = stage.questions.length - mcCount - orderCount - dialogueCount;

  const sections = [];
  let pos = 0;
  if (mcCount > 0) { sections.push({ label: "Regular Questions", start: pos, len: mcCount }); pos += mcCount; }
  if (orderCount > 0) { sections.push({ label: "Word Order", start: pos, len: orderCount }); pos += orderCount; }
  if (translateCount > 0) { sections.push({ label: "Translation", start: pos, len: translateCount }); pos += translateCount; }
  if (dialogueCount > 0) { sections.push({ label: "Dialogue", start: pos, len: dialogueCount }); pos += dialogueCount; }
  return sections;
}

function renderSubTabs(sections) {
  const el = document.getElementById("subTabs");

  if (sections.length < 2) { el.innerHTML = ""; return; }

  el.innerHTML = sections.map(s => {
    const active = current >= s.start && current < s.start + s.len;
    return `<button class="sub-tab${active ? " active" : ""}" data-start="${s.start}">${s.label}</button>`;
  }).join("");
  el.querySelectorAll(".sub-tab").forEach(btn => {
    btn.onclick = () => { current = Number(btn.dataset.start); render(); };
  });
}

function normalizeAnswer(str) {
  return str.trim().toLowerCase().replace(/[?.!,]/g, "").replace(/\s+/g, " ");
}

function tokenize(str) {
  return str.trim().toLowerCase().replace(/[’‘]/g, "'").replace(/[?.!,]/g, "").replace(/\s+/g, " ").split(" ").filter(Boolean);
}

const VERB_LEXICON = new Set(["like","work","works","study","studies","need","needs","walk","walks","fit","fits","live","lives","play","plays","watch","watches","eat","eats","drink","drinks","go","goes","come","comes","want","wants","know","knows","think","thinks","feel","feels","look","looks","sound","sounds","run","runs","call","calls","ask","asks","tell","tells","say","says","see","sees","do","does","make","makes","take","takes","get","gets","give","gives","find","finds","use","uses","try","tries","help","helps","start","starts","stop","stops","finish","finishes","arrive","arrives","leave","leaves","meet","meets","visit","visits","buy","buys","sell","sells","read","reads","write","writes","speak","speaks","talk","talks","listen","listens","hear","hears","understand","understands","remember","remembers","forget","forgets","believe","believes","hope","hopes","wish","wishes","plan","plans","decide","decides","choose","chooses","bring","brings","send","sends","open","opens","close","closes","turn","turns","wait","waits","stay","stays","drive","drives","fly","flies","swim","swims","cook","cooks","clean","cleans","wash","washes","sleep","sleeps","wake","wakes","dance","dances","sing","sings","paint","paints","draw","draws","build","builds","fix","fixes","break","breaks","cut","cuts","pay","pays","spend","spends","save","saves","lose","loses","win","wins","learn","learns","teach","teaches","sit","sits","stand","stands","wear","wears","carry","carries","hold","holds","push","pushes","pull","pulls","throw","throws","enjoy","enjoys","hate","hates","love","loves","prefer","prefers","travel","travels","move","moves","park","parks","ride","rides","practice","practices","exercise","exercises","shop","shops"]);

const IRREGULAR_PAST = { went:"go", saw:"see", did:"do", had:"have", was:"be", were:"be", ate:"eat", wrote:"write", came:"come", took:"take", got:"get", made:"make", said:"say", thought:"think", knew:"know", felt:"feel", left:"leave", met:"meet", ran:"run", sat:"sit", stood:"stand", spoke:"speak", drove:"drive", gave:"give", found:"find", told:"tell", bought:"buy", brought:"bring", understood:"understand", paid:"pay", sent:"send", built:"build", spent:"spend", kept:"keep", slept:"sleep", heard:"hear", held:"hold", won:"win", lost:"lose", chose:"choose", drew:"draw", flew:"fly", grew:"grow", threw:"throw", wore:"wear", broke:"break", forgot:"forget", hid:"hide", rode:"ride", rose:"rise", shook:"shake", stole:"steal", swam:"swim", taught:"teach", tore:"tear", woke:"wake" };

const THIRD_PERSON_TO_BASE = { works:"work", studies:"study", needs:"need", fits:"fit", lives:"live", plays:"play", watches:"watch", eats:"eat", drinks:"drink", goes:"go", comes:"come", wants:"want", knows:"know", thinks:"think", feels:"feel", looks:"look", sounds:"sound", runs:"run", calls:"call", asks:"ask", tells:"tell", says:"say", sees:"see", does:"do", makes:"make", takes:"take", gets:"get", gives:"give", finds:"find", uses:"use", tries:"try", helps:"help", starts:"start", stops:"stop", finishes:"finish", arrives:"arrive", leaves:"leave", meets:"meet", visits:"visit", buys:"buy", sells:"sell", reads:"read", writes:"write", speaks:"speak", talks:"talk", listens:"listen", hears:"hear", understands:"understand", remembers:"remember", forgets:"forget", believes:"believe", hopes:"hope", wishes:"wish", plans:"plan", decides:"decide", chooses:"choose", brings:"bring", sends:"send", opens:"open", closes:"close", turns:"turn", waits:"wait", stays:"stay", drives:"drive", flies:"fly", swims:"swim", cooks:"cook", cleans:"clean", washes:"wash", sleeps:"sleep", wakes:"wake", dances:"dance", sings:"sing", paints:"paint", draws:"draw", builds:"build", fixes:"fix", breaks:"break", cuts:"cut", pays:"pay", spends:"spend", saves:"save", loses:"lose", wins:"win", learns:"learn", teaches:"teach", sits:"sit", stands:"stand", wears:"wear", carries:"carry", holds:"hold", pushes:"push", pulls:"pull", throws:"throw", enjoys:"enjoy", hates:"hate", loves:"love", prefers:"prefer", travels:"travel", moves:"move", parks:"park", rides:"ride", practices:"practice", exercises:"exercise", shops:"shop" };

const QUESTION_WORDS = new Set(["what","where","when","why","how","who","which","whose"]);
const AUX_WORDS = new Set(["do","does","did","are","is","am","can","could","will","would","should","have","has","was","were"]);

function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

function isVerbLike(word) {
  if (!word) return false;
  if (VERB_LEXICON.has(word) || IRREGULAR_PAST[word]) return true;
  if (word.endsWith("ing") && word.length > 4) return true;
  if (word.endsWith("ed") && word.length > 3) return true;
  if (word.endsWith("s") && word.length > 3 && VERB_LEXICON.has(word.slice(0, -1))) return true;
  return false;
}

function findAuxIndex(tokens, maxIdx) {
  for (let i = 0; i <= Math.min(maxIdx, tokens.length - 1); i++) {
    if (AUX_WORDS.has(tokens[i])) return i;
  }
  return -1;
}

function checkAuxAgreement(tokens, auxIdx) {
  const aux = tokens[auxIdx];
  const subject = tokens[auxIdx + 1];
  if (!subject) return { ok: true };
  if (["i", "you", "we", "they"].includes(subject)) {
    if (aux === "does") return { ok: false, note: `"Does" מתאים רק לגוף שלישי יחיד (he/she/it) — עם "${subject}" צריך "Do".` };
    if (aux === "is" && ["you", "we", "they"].includes(subject)) return { ok: false, note: `"Is" לא מתאים ל-"${subject}" — צריך "Are".` };
    if (aux === "am" && subject !== "i") return { ok: false, note: `"Am" משמש רק עם "I".` };
  } else if (["he", "she", "it"].includes(subject)) {
    if (aux === "do") return { ok: false, note: `עם "${subject}" צריך "Does" ולא "Do".` };
    if (aux === "are") return { ok: false, note: `עם "${subject}" צריך "Is" ולא "Are".` };
  }
  return { ok: true };
}

const PRONOUNS = new Set(["i", "you", "he", "she", "it", "we", "they"]);

function checkQuestionWords(tokens) {
  if (!tokens.length) return { ok: false, note: "נסו לכתוב שאלה." };
  const first = tokens[0];
  if (QUESTION_WORDS.has(first)) {
    const auxIdx = findAuxIndex(tokens, 2);
    if (auxIdx === -1) {
      if (["who", "what"].includes(first) && !PRONOUNS.has(tokens[1])) return { ok: true };
      return { ok: false, note: `אחרי "${cap(first)}" צריך פועל עזר (do/does/did/are/is) לפני הנושא — למשל "${cap(first)} do you...?"` };
    }
    return checkAuxAgreement(tokens, auxIdx);
  }
  if (AUX_WORDS.has(first)) return checkAuxAgreement(tokens, 0);
  return { ok: false, note: "שאלות באנגלית בדרך כלל מתחילות במילת שאלה (What/Where/Why...) או בפועל עזר (Do/Are/Is...)." };
}

function checkDoAre(tokens) {
  const base = checkQuestionWords(tokens);
  if (!base.ok) return base;
  const auxIdx = findAuxIndex(tokens, 2);
  if (auxIdx === -1) return base;
  const aux = tokens[auxIdx];
  const subject = tokens[auxIdx + 1];
  const nextWord = tokens[auxIdx + 2];
  const thirdPerson = ["he", "she", "it"].includes(subject);
  if (["do", "does"].includes(aux) && nextWord && !isVerbLike(nextWord) && !AUX_WORDS.has(nextWord)) {
    return { ok: false, note: `אחרי "${cap(aux)}" בדרך כלל בא פועל פעולה — אם אין כאן פועל פעולה, אולי צריך "${thirdPerson ? "Is" : "Are"}" במקום.` };
  }
  if (["are", "is", "am"].includes(aux) && nextWord && isVerbLike(nextWord) && !nextWord.endsWith("ing")) {
    return { ok: false, note: `אחרי "${cap(aux)}" יש כאן מה שנראה כמו פועל פעולה ("${nextWord}") — אולי צריך "${thirdPerson ? "Does" : "Do"}" במקום.` };
  }
  return { ok: true };
}

function checkDidDo(tokens) {
  const base = checkQuestionWords(tokens);
  if (!base.ok) return base;
  const auxIdx = findAuxIndex(tokens, 2);
  if (auxIdx === -1) return base;
  const aux = tokens[auxIdx];
  const verb = tokens[auxIdx + 2];
  if (["did", "do", "does"].includes(aux) && verb) {
    if (IRREGULAR_PAST[verb]) return { ok: false, note: `אחרי "${cap(aux)}" הפועל צריך להיות בצורת הבסיס — "${IRREGULAR_PAST[verb]}" ולא "${verb}".` };
    if (THIRD_PERSON_TO_BASE[verb]) return { ok: false, note: `אחרי "${cap(aux)}" הפועל נשאר בצורת הבסיס — "${THIRD_PERSON_TO_BASE[verb]}" ולא "${verb}".` };
    if (verb.endsWith("ed") && verb.length > 3 && !VERB_LEXICON.has(verb)) return { ok: false, note: `אחרי "${cap(aux)}" הפועל נשאר בצורת הבסיס בלי "-ed" בסוף.` };
  }
  return { ok: true };
}

function checkIsAmThis(tokens) {
  if (!tokens.length) return { ok: false, note: "נסו לכתוב שאלה." };
  const first = tokens[0];
  if (!["is", "am"].includes(first)) {
    if (QUESTION_WORDS.has(first) || AUX_WORDS.has(first)) return { ok: true };
    return { ok: false, note: 'בשלב הזה מתרגלים שאלות שמתחילות ב-"Is" או "Am" — נסו זאת.' };
  }
  const subject = tokens[1];
  if (first === "am" && subject !== "i") return { ok: false, note: '"Am" משמש רק עם "I" — למשל "Am I...?"' };
  if (first === "is" && subject === "i") return { ok: false, note: 'עם "I" משתמשים ב-"Am", לא ב-"Is".' };
  return { ok: true };
}

function checkNegatives(tokens) {
  if (!tokens.length) return { ok: false, note: "נסו לכתוב משפט." };
  const joined = tokens.join(" ");
  let negIdx = tokens.findIndex(t => t === "didn't" || t === "didnt" || t === "doesn't" || t === "doesnt");
  let neg = negIdx >= 0 ? tokens[negIdx] : null;
  let twoWord = false;
  if (!neg && joined.includes("did not")) { neg = "did not"; negIdx = tokens.indexOf("did"); twoWord = true; }
  if (!neg && joined.includes("does not")) { neg = "does not"; negIdx = tokens.indexOf("does"); twoWord = true; }
  if (!neg) return { ok: false, note: `כדי לענות במשפט שלילי צריך "Didn't" (לכל הגופים, עבר) או "Doesn't" (הווה, גוף שלישי יחיד).` };
  const isDoes = neg.startsWith("doesn") || neg === "does not";
  const subject = tokens[Math.max(0, negIdx - 1)];
  if (isDoes && ["i", "you", "we", "they"].includes(subject)) {
    return { ok: false, note: `"Doesn't" מתאים רק לגוף שלישי יחיד (he/she/it) — עם "${subject}" צריך "Didn't".` };
  }
  const verbIdx = negIdx + (twoWord ? 2 : 1);
  const verb = tokens[verbIdx];
  if (verb) {
    if (IRREGULAR_PAST[verb]) return { ok: false, note: `אחרי "${neg}" הפועל צריך להיות בצורת הבסיס — "${IRREGULAR_PAST[verb]}" ולא "${verb}".` };
    if (THIRD_PERSON_TO_BASE[verb]) return { ok: false, note: `אחרי "${neg}" הפועל נשאר בצורת הבסיס — "${THIRD_PERSON_TO_BASE[verb]}" ולא "${verb}".` };
    if (verb.endsWith("ed") && verb.length > 3 && !VERB_LEXICON.has(verb)) return { ok: false, note: `אחרי "${neg}" הפועל נשאר בצורת הבסיס בלי "-ed".` };
  }
  return { ok: true };
}

function checkShortAnswers(tokens, theyAsk) {
  const answerType = tokens[0] === "no" ? "no" : "yes";
  if (!tokens.length) return { ok: false, note: 'נסו לכתוב תשובה קצרה, למשל "Yes, I do."', answerType };
  const first = tokens[0];
  if (first !== "yes" && first !== "no") return { ok: false, note: 'תשובה קצרה מתחילה ב-"Yes" או "No".', answerType };
  const subject = tokens[1];
  const auxRaw = tokens[2];
  if (!subject || !auxRaw) return { ok: false, note: 'תשובה קצרה בנויה כך: Yes/No, נושא, פועל עזר — למשל "Yes, I do."', answerType };
  const isNeg = /n't$|nt$/.test(auxRaw);
  const aux = auxRaw.replace(/n't$|nt$/, "");
  if (!["do", "does", "did"].includes(aux)) return { ok: false, note: `התשובה צריכה פועל עזר: do / does / did (בשלילה: don't / doesn't / didn't).`, answerType };
  if (first === "no" && !isNeg) return { ok: false, note: `עם "No" צריך צורה שלילית (don't / doesn't / didn't).`, answerType };
  if (first === "yes" && isNeg) return { ok: false, note: `עם "Yes" לא משתמשים בצורה השלילית.`, answerType };
  if (aux === "does" && ["i", "you", "we", "they"].includes(subject)) return { ok: false, note: `"Does" מתאים רק לגוף שלישי יחיד — עם "${subject}" צריך "Do".`, answerType };
  if (aux === "do" && ["he", "she", "it"].includes(subject)) return { ok: false, note: `עם "${subject}" צריך "Does" ולא "Do".`, answerType };
  if (theyAsk) {
    const qAux = tokenize(theyAsk)[0];
    if (["do", "does", "did"].includes(qAux) && qAux !== aux) return { ok: false, note: `השאלה נשאלה עם "${cap(qAux)}" — התשובה הקצרה צריכה להשתמש באותו פועל עזר.`, answerType };
  }
  return { ok: true, answerType };
}

const GRAMMAR_CHECKERS = {
  questionWords: checkQuestionWords,
  doAre: checkDoAre,
  didDo: checkDidDo,
  isAmThis: checkIsAmThis,
  negatives: checkNegatives,
  shortAnswers: checkShortAnswers
};

function renderTranslateQuestion(q) {
  const input = document.getElementById("translateInput");
  const btn = document.getElementById("checkBtn");

  function check() {
    const userVal = normalizeAnswer(input.value);
    const isCorrect = q.answers.some(a => normalizeAnswer(a) === userVal);
    input.disabled = true;
    input.classList.add(isCorrect ? "correct" : "wrong");
    document.getElementById("hint").innerHTML = isCorrect
      ? `Correct! <strong>${q.display}</strong>`
      : `Not quite — a correct answer is: <strong>${q.display}</strong>`;

    if (isCorrect) { score++; playCorrectSound(); }
    else { playWrongSound(); }
    document.getElementById("scorelive").textContent = score;

    btn.textContent = "Next →";
    btn.onclick = () => { current++; render(); };
  }

  btn.onclick = check;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") check();
  });
  input.focus();
}

function escapeAttr(s) {
  return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function renderDialogueLog(log) {
  return log.map(m => `<div class="dialogue-msg ${m.who}">${m.text} <button class="speak-btn" onclick="speak(this.dataset.text)" data-text="${escapeAttr(m.text)}" title="Listen" aria-label="Listen">🔊</button></div>`).join("");
}

function formatUserLine(raw, isStatement) {
  let t = raw.trim().replace(/\s+/g, " ");
  if (!t) return t;
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.?!]$/.test(t)) t += isStatement ? "." : "?";
  return t;
}

function pickReply(stage) {
  const pool = stage.dialogueReplies || [];
  if (!pool.length) return null;
  let idx = Math.floor(Math.random() * pool.length);
  if (pool.length > 1 && idx === dialogueLastReply[stageIndex]) idx = (idx + 1) % pool.length;
  dialogueLastReply[stageIndex] = idx;
  return pool[idx];
}

function checkTopic(tokens, topic) {
  if (!topic || !topic.length) return true;
  const joined = tokens.join(" ");
  return topic.some(kw => joined.includes(kw));
}

function renderDialogueQuestion(q, stage) {
  const input = document.getElementById("translateInput");
  const btn = document.getElementById("checkBtn");

  async function check() {
    const raw = input.value;
    if (!raw.trim()) { input.focus(); return; }
    input.disabled = true;
    btn.disabled = true;
    document.getElementById("hint").textContent = DIALOGUE_API_URL ? "…" : "";

    const log = dialogueLog[stageIndex] || (dialogueLog[stageIndex] = []);
    const aiResult = await getDialogueResponse(stage, log, raw);

    let result, reply;
    if (aiResult) {
      result = { ok: aiResult.ok, note: aiResult.note };
      reply = aiResult.reply;
    } else {
      const tokens = tokenize(raw);
      const checker = GRAMMAR_CHECKERS[stage.dialogueGrammar];
      const grammarResult = checker ? checker(tokens, q.theyAsk) : { ok: true };
      if (!grammarResult.ok) {
        result = grammarResult;
      } else if (!checkTopic(tokens, q.topic)) {
        result = { ok: false, note: `דקדוקית זה תקין, אבל זה לא מה שהתבקשתם לומר. ${q.display ? `דוגמה: "${q.display}"` : ""}` };
      } else {
        result = grammarResult;
      }
      reply = (q.yesReply || q.noReply) ? (result.answerType === "no" ? q.noReply : q.yesReply) : (q.reply || pickReply(stage));
    }

    btn.disabled = false;
    input.classList.add(result.ok ? "correct" : "wrong");
    document.getElementById("hint").innerHTML = result.ok
      ? "Looks good!"
      : `Grammar note: ${result.note}`;

    if (result.ok) { score++; playCorrectSound(); }
    else { playWrongSound(); }
    document.getElementById("scorelive").textContent = score;

    btn.textContent = "Next →";
    btn.onclick = () => {
      log.push({ who: "you", text: formatUserLine(raw, !!q.theyAsk) });
      if (reply) log.push({ who: "them", text: reply });
      current++;
      render();
    };
  }

  btn.onclick = check;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") check();
  });
  input.focus();
}

function renderOrderQuestion(q) {
  let placed = [];
  const shuffled = shuffle(q.answer.map((w, i) => ({ w, i })));
  if (q.answer.length > 1 && shuffled.every((item, idx) => item.i === idx)) {
    [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
  }

  function draw() {
    const buildEl = document.getElementById("orderBuild");
    const bankEl = document.getElementById("orderBank");
    buildEl.classList.toggle("empty", placed.length === 0);
    buildEl.innerHTML = placed.map(p => `<button class="chip placed" data-i="${p.i}">${p.w}</button>`).join("");
    bankEl.innerHTML = shuffled.map(item => {
      const used = placed.some(p => p.i === item.i);
      return `<button class="chip" data-i="${item.i}" ${used ? "disabled" : ""}>${item.w}</button>`;
    }).join("");

    buildEl.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        placed = placed.filter(p => p.i !== Number(btn.dataset.i));
        draw();
      });
    });
    bankEl.querySelectorAll(".chip:not(:disabled)").forEach(btn => {
      btn.addEventListener("click", () => {
        placed.push(shuffled.find(s => s.i === Number(btn.dataset.i)));
        draw();
        if (placed.length === q.answer.length) checkOrder();
      });
    });
  }

  function checkOrder() {
    const buildEl = document.getElementById("orderBuild");
    const userOrder = placed.map(p => p.w);
    const isCorrect = JSON.stringify(userOrder) === JSON.stringify(q.answer);
    buildEl.classList.add(isCorrect ? "correct" : "wrong");
    buildEl.querySelectorAll(".chip").forEach(b => b.disabled = true);
    document.getElementById("orderBank").querySelectorAll(".chip").forEach(b => b.disabled = true);

    const sentence = q.answer.join(" ");
    const proper = sentence.charAt(0).toUpperCase() + sentence.slice(1) + q.punct;
    document.getElementById("hint").innerHTML = isCorrect
      ? `Correct! <strong>${proper}</strong>`
      : `Almost — the correct order is: <strong>${proper}</strong>${q.why ? `<span class="why">${q.why}</span>` : ""}`;

    if (isCorrect) { score++; playCorrectSound(); }
    else { playWrongSound(); }
    document.getElementById("scorelive").textContent = score;
    document.getElementById("nextBtn").classList.add("show");
    document.getElementById("nextBtn").onclick = () => {
      current++;
      render();
    };
  }

  draw();
}

function selectAnswer(btn, q) {
  const correctAnswer = q.answer;
  const buttons = document.querySelectorAll(".opt");
  const isCorrect = btn.dataset.value === correctAnswer;

  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.value === correctAnswer) b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
  });

  document.getElementById("hint").innerHTML = isCorrect
    ? "Correct!"
    : `Not quite — the correct answer is "${correctAnswer}".<span class="why">${q.why}</span>`;

  if (isCorrect) {
    score++;
    playCorrectSound();
  } else {
    playWrongSound();
  }
  document.getElementById("scorelive").textContent = score;
  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("nextBtn").onclick = () => {
    current++;
    render();
  };
}

function restart() {
  stageIndex = 0;
  current = 0;
  score = 0;
  render();
}

render();
</script>
