      --ink-soft: #a49c8a;

      --card: #23221e;

      --accent-soft: #1e3336;
      --highlight: #e8b23d;

      --wrong: #e08a6c;

    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1b18;
    --ink: #ece7dc;
    --ink-soft: #a49c8a;
    --rule: #3a382f;
    --card: #23221e;
    --accent: #6bc2cb;
    --accent-soft: #1e3336;
    --highlight: #e8b23d;
    --correct: #7bc99a;
    --correct-bg: #1c3324;

    --wrong-bg: #3a2019;
  }
  :root[data-theme="light"] {
    --paper: #f6f3ec;
    --ink: #2b2a28;
    --ink-soft: #6b6558;
    --rule: #d8d2c4;
    --card: #fffefb;
    --accent: #1f6f78;
    --accent-soft: #e3eeee;
    --highlight: #d99a2b;
    --correct: #2f7d4f;
    --correct-bg: #e3f2e6;
    --wrong: #b3432b;
    --wrong-bg: #fbe8e3;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 3rem 1rem;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 620px; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;

    padding-bottom: .6rem;
    margin-bottom: .35rem;
  }

  }
  .masthead .level {
    font-size: .7rem;
    letter-spacing: .08em;

    color: var(--ink-soft);

  }
  .sub {

    color: var(--ink);
    direction: rtl;
  }
  .legend strong { color: var(--accent); }

  .stage-tabs {
    display: flex;
    gap: .5rem;
    margin-bottom: 1.5rem;
  }
  .stage-tab {
    padding: .4rem .95rem;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .stage-tab:hover { border-color: var(--accent); color: var(--accent); }
  .stage-tab.active {
    border-color: var(--accent);

  }

  .progress-row {

    justify-content: space-between;

  }
  .progress-row strong { color: var(--ink); font-weight: 700; }
  .bar {
    width: 100%;
    height: 4px;
    background: var(--rule);

    overflow: hidden;
    margin-bottom: 1.75rem;
  }

    height: 100%;
    background: var(--highlight);

  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2rem 1.75rem;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 1.75rem; right: 1.75rem;

    background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px);
  }

  .sentence {

  }
  .blank {

    min-width: 84px;

    text-align: center;
    font-weight: 700;

  }

  .options {

  }
  .opt.wrong {

    font-weight: 700;
  }

  .hint {
    margin-top: 1.1rem;
    font-size: .85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
    direction: rtl;
  }
  .hint .why {
    display: block;
    margin-top: .35rem;

  }

  .footer-row {
    margin-top: 1.5rem;

    justify-content: flex-end;
  }
  button.next {

    padding: .65rem 1.35rem;

  button.next:focus-visible,

  button.restart:focus-visible {

  }

  .result { text-align: center; }

</style>

<script>
const stages = [
  {

    questions: [
      { sentence: "___ is your name?", answer: "What", options: ["What", "Who", "Where", "When"], why: "שואלים על <em>דבר</em> (השם עצמו) ולא על אדם או מקום, לכן What ולא Who." },
      { sentence: "___ do you live?", answer: "Where", options: ["Where", "What", "Why", "Who"], why: "שואלים על <em>מקום</em> המגורים, לכן Where." },
      { sentence: "___ were you late for the meeting?", answer: "Why", options: ["Why", "When", "How", "What"], why: "שואלים על <em>סיבה</em> לאיחור, לכן Why." },
      { sentence: "___ does the movie start?", answer: "When", options: ["When", "Where", "Which", "Who"], why: "שואלים על <em>זמן</em> ההתחלה, לכן When." },
      { sentence: "___ many brothers do you have?", answer: "How", options: ["How", "What", "Which", "Why"], why: "\"How many\" משמש לשאלה על <em>כמות</em> (מספר אחים), לכן How." },
      { sentence: "___ old is your grandfather?", answer: "How", options: ["How", "What", "When", "Who"], why: "\"How old\" הוא ביטוי קבוע לשאלה על <em>גיל</em>, לכן How." },
      { sentence: "___ is that man standing by the door?", answer: "Who", options: ["Who", "What", "Whose", "Which"], why: "שואלים על <em>זהות של אדם</em>, לכן Who." },
      { sentence: "___ book do you want, this one or that one?", answer: "Which", options: ["Which", "What", "Whose", "Who"], why: "יש שתי אפשרויות ידועות (הספר הזה או ההוא), ולכן משתמשים ב-Which לבחירה מתוך אפשרויות מוגבלות." },
      { sentence: "___ bag is this? It was left on the table.", answer: "Whose", options: ["Whose", "Who", "Which", "What"], why: "שואלים <em>למי שייך</em> התיק, לכן Whose (בעלות)." },
      { sentence: "___ do you usually get to school, by bus or on foot?", answer: "How", options: ["How", "Why", "When", "What"], why: "שואלים על <em>אופן/דרך</em> ההגעה, לכן How." },
      { sentence: "___ long does the flight to London take?", answer: "How", options: ["How", "What", "When", "Why"], why: "\"How long\" משמש לשאלה על <em>משך זמן</em>, לכן How." },
      { sentence: "___ often do you go to the gym?", answer: "How", options: ["How", "When", "Why", "What"], why: "\"How often\" משמש לשאלה על <em>תדירות</em>, לכן How." },
      { sentence: "___ is the team meeting scheduled for tomorrow?", answer: "When", options: ["When", "Where", "Why", "Which"], why: "שואלים על <em>זמן</em>, לכן When." },
      { sentence: "___ is coming to the party tonight?", answer: "Who", options: ["Who", "Whose", "What", "Which"], why: "שואלים על <em>זהות האדם</em> שמגיע, לכן Who." },
      { sentence: "___ much does this jacket cost?", answer: "How", options: ["How", "What", "Which", "Why"], why: "\"How much\" משמש לשאלה על <em>מחיר/כמות</em>, לכן How." }
    ]
  },
  {
    title: "Do or Are Drill",
    sub: "בחרו Do או Are: משתמשים ב-Are לפני שם/תואר/מקום (הפועל to be), וב-Do כשיש פועל פעולה נוסף במשפט",
    legend: "<strong>Are</strong> – משמש עם הפועל to be, כשאחרי המילה מגיע שם עצם, תואר או ביטוי מקום (בלי פועל פעולה נוסף) &nbsp;·&nbsp; <strong>Do</strong> – משמש כפועל עזר כשיש במשפט <em>פועל פעולה</em> נוסף (like, work, study, need, walk, fit...)",
    questions: [
      { sentence: "___ you a teacher?", answer: "Are", options: ["Are", "Do"], why: "אחרי Are מגיע שם עצם (a teacher), אין פועל פעולה נוסף במשפט." },
      { sentence: "___ you like pizza?", answer: "Do", options: ["Do", "Are"], why: "\"like\" הוא פועל פעולה, ולכן צריך את פועל העזר Do." },
      { sentence: "___ they students at this school?", answer: "Are", options: ["Are", "Do"], why: "אחרי Are מגיע שם עצם (students), אין פועל פעולה נוסף." },
      { sentence: "___ they study English every day?", answer: "Do", options: ["Do", "Are"], why: "\"study\" הוא פועל פעולה, לכן Do." },

      { sentence: "___ you work on weekends?", answer: "Do", options: ["Do", "Are"], why: "\"work\" הוא פועל פעולה, לכן Do." },
      { sentence: "___ your parents at home right now?", answer: "Are", options: ["Are", "Do"], why: "אחרי Are מגיע ביטוי מקום (at home), אין פועל פעולה נוסף." },
      { sentence: "___ your parents watch the news together?", answer: "Do", options: ["Do", "Are"], why: "\"watch\" הוא פועל פעולה, לכן Do." },
      { sentence: "___ we ready to go?", answer: "Are", options: ["Are", "Do"], why: "אחרי Are מגיע תואר (ready), אין פועל פעולה נוסף." },
      { sentence: "___ we need to bring anything?", answer: "Do", options: ["Do", "Are"], why: "\"need\" הוא פועל פעולה, לכן Do." },
      { sentence: "___ you tired after the trip?", answer: "Are", options: ["Are", "Do"], why: "אחרי Are מגיע תואר (tired), אין פועל פעולה נוסף." },
      { sentence: "___ you usually walk to work?", answer: "Do", options: ["Do", "Are"], why: "\"walk\" הוא פועל פעולה, לכן Do." },
      { sentence: "___ these shoes comfortable?", answer: "Are", options: ["Are", "Do"], why: "אחרי Are מגיע תואר (comfortable), אין פועל פעולה נוסף." },
      { sentence: "___ these shoes fit you well?", answer: "Do", options: ["Do", "Are"], why: "\"fit\" הוא פועל פעולה, לכן Do." },
      { sentence: "___ you and your brother close in age?", answer: "Are", options: ["Are", "Do"], why: "אחרי Are מגיע תואר (close), אין פועל פעולה נוסף." }
    ]
  },
  {
    title: "Is she / Is this / Am I",
    sub: "בחרו את הפתיח הנכון — Is she / Is this / Am I",
    legend: "<strong>Am I</strong> – שואלים על עצמכם (הדובר) &nbsp;·&nbsp; <strong>Is she</strong> – שואלים על אישה/בחורה שכבר הוזכרה בהקשר, ולא נמצאת מולכם &nbsp;·&nbsp; <strong>Is this</strong> – מצביעים או מראים על משהו/מישהו שנמצא ממש לפניכם עכשיו",
    questions: [
      { sentence: "Emma just got back from her trip. ___ tired?", answer: "Is she", options: ["Is she", "Is this", "Am I"], why: "מדובר על Emma (אישה) שכבר הוזכרה במשפט הקודם ואינה נוכחת מולכם, לכן Is she." },
      { sentence: "<em>(מצביעים על מחשב נייד על השולחן)</em> ___ yours?", answer: "Is this", options: ["Is she", "Is this", "Am I"], why: "מצביעים על חפץ ספציפי שנמצא ממש לפניכם, לכן Is this." },
      { sentence: "I just woke up very late. ___ still on time for the meeting?", answer: "Am I", options: ["Is she", "Is this", "Am I"], why: "השאלה היא על עצמכם (הדובר), לכן Am I." },
      { sentence: "<em>(מרימים חולצה כדי להראות)</em> ___ too small for you?", answer: "Is this", options: ["Is she", "Is this", "Am I"], why: "מצביעים ומראים על חפץ ספציפי (החולצה), לכן Is this." },
      { sentence: "My sister loves painting. ___ working on a new piece these days?", answer: "Is she", options: ["Is she", "Is this", "Am I"], why: "מדובר על האחות (אישה) שהוזכרה קודם ואינה נוכחת מולכם, לכן Is she." },
      { sentence: "___ allowed to park here?", answer: "Am I", options: ["Is she", "Is this", "Am I"], why: "השאלה היא על עצמכם, לכן Am I." },
      { sentence: "<em>(מראים תמונה של אישה)</em> ___ your mother?", answer: "Is this", options: ["Is she", "Is this", "Am I"], why: "מצביעים ומראים על תמונה ספציפית שלפניכם, לכן Is this — למרות שמדובר באישה." },
      { sentence: "Grandma hasn't called in a while. ___ okay?", answer: "Is she", options: ["Is she", "Is this", "Am I"], why: "מדובר בסבתא (אישה) שהוזכרה במשפט הקודם ואינה נוכחת מולכם, לכן Is she." },
      { sentence: "___ the one who's supposed to bring the cake?", answer: "Am I", options: ["Is she", "Is this", "Am I"], why: "השאלה היא על עצמכם, לכן Am I." },
      { sentence: "<em>(מצביעים על הבניין שממול)</em> ___ where you work?", answer: "Is this", options: ["Is she", "Is this", "Am I"], why: "מצביעים על מקום ספציפי שנמצא ממש מולכם, לכן Is this." },
      { sentence: "Lily seems upset today. ___ okay?", answer: "Is she", options: ["Is she", "Is this", "Am I"], why: "מדובר בלילי (אישה) שהוזכרה קודם ואינה נוכחת מולכם, לכן Is she." },
      { sentence: "I think I left the stove on. ___ overreacting?", answer: "Am I", options: ["Is she", "Is this", "Am I"], why: "השאלה היא על עצמכם, לכן Am I." },
      { sentence: "<em>(מצביעים על כיסא מסוים)</em> ___ taken?", answer: "Is this", options: ["Is she", "Is this", "Am I"], why: "מצביעים על חפץ ספציפי (הכיסא), לכן Is this." },
      { sentence: "My aunt just moved abroad. ___ happy with the change?", answer: "Is she", options: ["Is she", "Is this", "Am I"], why: "מדובר בדודה (אישה) שהוזכרה קודם ואינה נוכחת מולכם, לכן Is she." },
      { sentence: "___ dressed appropriately for the interview?", answer: "Am I", options: ["Is she", "Is this", "Am I"], why: "השאלה היא על עצמכם, לכן Am I." }
    ]
  }
];

let stageIndex = 0;
let current = 0;
let score = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderTabs() {
  const tabs = document.getElementById("stageTabs");
  tabs.innerHTML = stages
    .map((s, i) => `<button class="stage-tab${i === stageIndex ? " active" : ""}" data-stage="${i}">${i + 1}. ${s.title}</button>`)
    .join("");
  tabs.querySelectorAll(".stage-tab").forEach(btn => {
    btn.addEventListener("click", () => goToStage(Number(btn.dataset.stage)));
  });
}

function goToStage(i) {
  stageIndex = i;
  current = 0;
  render();
}

function render() {
  const card = document.getElementById("quizCard");
  const stage = stages[stageIndex];
  renderTabs();
  document.getElementById("stageTitle").textContent = stage.title;
  document.getElementById("stageSub").textContent = stage.sub;
  document.getElementById("legend").innerHTML = stage.legend;
  document.getElementById("levelTag").textContent = `STAGE ${stageIndex + 1} / ${stages.length}`;
  document.getElementById("qnum").textContent = current + 1;
  document.getElementById("qtotal").textContent = stage.questions.length;
  document.getElementById("scorelive").textContent = score;
  document.getElementById("barFill").style.width = `${(current / stage.questions.length) * 100}%`;

  if (current >= stage.questions.length) {
    const isLastStage = stageIndex === stages.length - 1;
    const totalQuestions = stages.reduce((sum, s) => sum + s.questions.length, 0);

    if (!isLastStage) {
      document.getElementById("levelTag").textContent = `STAGE ${stageIndex + 1} COMPLETE`;
      card.innerHTML = `
        <div class="result">
          <span class="level">שלב ${stageIndex + 1} הושלם</span>
          <div>ניקוד עד כה</div>
          <div class="score">${score} / ${stage.questions.length}</div>
          <p>מוכנים לשלב הבא: ${stages[stageIndex + 1].title}</p>
          <button class="restart" onclick="goToStage(${stageIndex + 1})">לשלב הבא →</button>
        </div>`;
      document.getElementById("barFill").style.width = "100%";
      return;
    }

    document.getElementById("levelTag").textContent = "COMPLETE";
    const verdict = score === totalQuestions
      ? "מושלם! שליטה מלאה בשני השלבים."
      : score >= totalQuestions * 0.7
      ? "כל הכבוד, ביצוע טוב מאוד!"
      : "לא רע — כדאי לחזור על התרגול לחיזוק.";
    card.innerHTML = `
      <div class="result">
        <span class="level">INTERMEDIATE</span>
        <div>סיימת את שני השלבים</div>
        <div class="score">${score} / ${totalQuestions}</div>
        <p>${verdict}</p>
        <button class="restart" onclick="restart()">התחל מחדש</button>
      </div>`;
    document.getElementById("barFill").style.width = "100%";
    return;
  }

  const q = stage.questions[current];
  const opts = shuffle(q.options);

  card.innerHTML = `
    <div class="sentence">${q.sentence.replace("___", '<span class="blank">____</span>')}</div>
    <div class="options">
      ${opts.map(o => `<button class="opt" data-value="${o}">${o}</button>`).join("")}
    </div>
    <div class="hint" id="hint"></div>
    <div class="footer-row"><button class="next" id="nextBtn">הבא →</button></div>
  `;

  card.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => selectAnswer(btn, q));
  });
}

function selectAnswer(btn, q) {
  const correctAnswer = q.answer;
  const buttons = document.querySelectorAll(".opt");
  const isCorrect = btn.dataset.value === correctAnswer;

  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.value === correctAnswer) b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
  });

  document.getElementById("hint").innerHTML = isCorrect
    ? "נכון!"
    : `לא מדויק — התשובה הנכונה היא "${correctAnswer}".<span class="why">${q.why}</span>`;

  if (isCorrect) score++;
  document.getElementById("scorelive").textContent = score;
  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("nextBtn").onclick = () => {
    current++;
    render();
  };
}

function restart() {
  stageIndex = 0;
  current = 0;
  score = 0;
  render();
}

render();
</script>
