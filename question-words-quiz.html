<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Words Drill</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f6f3ec;
    --ink: #2b2a28;
    --ink-soft: #6b6558;
    --rule: #d8d2c4;
    --card: #fffefb;
    --accent: #1f6f78;
    --accent-soft: #e3eeee;
    --highlight: #d99a2b;
    --correct: #2f7d4f;
    --correct-bg: #e3f2e6;
    --wrong: #b3432b;
    --wrong-bg: #fbe8e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1c1b18;
      --ink: #ece7dc;
      --ink-soft: #a49c8a;
      --rule: #3a382f;
      --card: #23221e;
      --accent: #6bc2cb;
      --accent-soft: #1e3336;
      --highlight: #e8b23d;
      --correct: #7bc99a;
      --correct-bg: #1c3324;
      --wrong: #e08a6c;
      --wrong-bg: #3a2019;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1b18;
    --ink: #ece7dc;
    --ink-soft: #a49c8a;
    --rule: #3a382f;
    --card: #23221e;
    --accent: #6bc2cb;
    --accent-soft: #1e3336;
    --highlight: #e8b23d;
    --correct: #7bc99a;
    --correct-bg: #1c3324;
    --wrong: #e08a6c;
    --wrong-bg: #3a2019;
  }
  :root[data-theme="light"] {
    --paper: #f6f3ec;
    --ink: #2b2a28;
    --ink-soft: #6b6558;
    --rule: #d8d2c4;
    --card: #fffefb;
    --accent: #1f6f78;
    --accent-soft: #e3eeee;
    --highlight: #d99a2b;
    --correct: #2f7d4f;
    --correct-bg: #e3f2e6;
    --wrong: #b3432b;
    --wrong-bg: #fbe8e3;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 3rem 1rem;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 620px; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: .6rem;
    margin-bottom: .35rem;
  }
  .masthead h1 {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: .01em;
  }
  .masthead .level {
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .sub {
    color: var(--ink-soft);
    font-size: .88rem;
    margin: .6rem 0 1.25rem;
    direction: rtl;
  }

  .legend {
    background: var(--accent-soft);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: .85rem 1rem;
    margin-bottom: 1.25rem;
    font-size: .82rem;
    line-height: 1.7;
    color: var(--ink);
    direction: rtl;
  }
  .legend strong { color: var(--accent); }

  .stage-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin-bottom: 1.5rem;
  }
  .stage-tab {
    padding: .4rem .95rem;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .stage-tab:hover { border-color: var(--accent); color: var(--accent); }
  .stage-tab.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: .4rem;
    font-size: .8rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .progress-row strong { color: var(--ink); font-weight: 700; }
  .bar {
    width: 100%;
    height: 4px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.75rem;
  }
  .bar-fill {
    height: 100%;
    background: var(--highlight);
    transition: width .35s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2rem 1.75rem;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 1.75rem; right: 1.75rem;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px);
  }

  .sentence {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.4rem;
    line-height: 1.65;
    margin: .5rem 0 1.75rem;
  }
  .blank {
    display: inline-block;
    min-width: 84px;
    border-bottom: 2px solid var(--highlight);
    text-align: center;
    font-weight: 700;
    color: var(--highlight);
  }

  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: .65rem;
  }
  .opt {
    padding: .75rem 1rem;
    border-radius: 3px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.05rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    text-align: center;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .opt:disabled { cursor: default; }
  .opt.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 700;
  }
  .opt.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
    font-weight: 700;
  }

  .hint {
    margin-top: 1.1rem;
    font-size: .85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }
  .hint .why {
    display: block;
    margin-top: .35rem;
    color: var(--wrong);
    direction: rtl;
    text-align: right;
  }

  .sub-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin-bottom: 1.25rem;
  }
  .sub-tab {
    flex: 1;
    padding: .5rem .75rem;
    border-radius: 4px;
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .sub-tab:hover { border-color: var(--accent); color: var(--accent); }
  .sub-tab.active {
    border-color: var(--highlight);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .translate-prompt {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.3rem;
    line-height: 1.6;
    margin: .5rem 0 1.5rem;
    padding: 1rem 1.25rem;
    background: var(--accent-soft);
    border-radius: 4px;
  }

  .dialogue-scenario {
    font-style: italic;
    color: var(--ink-soft);
    direction: ltr;
    text-align: left;
    font-size: .92rem;
    margin: 0 0 1rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--rule);
  }
  .dialogue-log {
    display: flex;
    flex-direction: column;
    gap: .6rem;
  }
  .dialogue-log:not(:empty) {
    margin-bottom: 1rem;
  }
  .dialogue-msg {
    max-width: 80%;
    padding: .6rem .9rem;
    border-radius: 14px;
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: .95rem;
    line-height: 1.4;
    direction: ltr;
    text-align: left;
  }
  .speak-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: .85rem;
    padding: 0 0 0 .3rem;
    opacity: .6;
    vertical-align: middle;
  }
  .speak-btn:hover {
    opacity: 1;
  }
  .dialogue-msg.you {
    align-self: flex-end;
    background: var(--accent-soft);
    color: var(--accent);
    border-bottom-right-radius: 3px;
  }
  .dialogue-msg.them {
    align-self: flex-start;
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-bottom-left-radius: 3px;
    margin-bottom: 1rem;
  }
  .dialogue-cue {
    font-size: .85rem;
    color: var(--ink-soft);
    direction: rtl;
    text-align: right;
    margin-bottom: .6rem;
  }
  .translate-input {
    width: 100%;
    padding: .75rem 1rem;
    border-radius: 3px;
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.05rem;
    margin-bottom: 1rem;
  }
  .translate-input:focus { outline: none; border-color: var(--accent); }
  .translate-input:disabled { opacity: .8; }
  .translate-input.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
  }
  .translate-input.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
    color: var(--wrong);
  }

  .speak-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .6rem;
    margin-bottom: .5rem;
  }
  .mic-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    font-size: 1.9rem;
    cursor: pointer;
    transition: transform .12s ease, background .15s;
  }
  .mic-btn:hover:not(:disabled) { transform: scale(1.05); }
  .mic-btn:disabled { opacity: .4; cursor: default; }
  .mic-btn.listening {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--wrong-bg); }
    50% { box-shadow: 0 0 0 10px transparent; }
  }
  .speak-status {
    font-size: .88rem;
    color: var(--ink-soft);
    text-align: center;
  }
  .heard {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1rem;
    direction: ltr;
    text-align: center;
  }
  .chat-input-row {
    display: flex;
    gap: .5rem;
    align-items: flex-start;
  }
  .chat-input-row .translate-input { flex: 1; margin-bottom: 0; }
  .chat-send, .chat-mic {
    padding: .75rem 1rem;
    border-radius: 3px;
    border: 1.5px solid var(--accent);
    background: var(--accent);
    color: var(--paper);
    font-weight: 600;
    cursor: pointer;
  }
  .chat-mic { background: var(--accent-soft); padding: .7rem .8rem; }
  .chat-mic.listening { background: var(--wrong-bg); border-color: var(--wrong); }
  .chat-send:disabled, .chat-mic:disabled { opacity: .4; cursor: default; }
  .chat-note {
    align-self: flex-end;
    font-size: .8rem;
    direction: rtl;
    text-align: right;
    max-width: 80%;
    margin-top: -.3rem;
  }
  .chat-note.ok { color: var(--correct); }
  .chat-note.bad { color: var(--wrong); }
  .chat-footer {
    justify-content: space-between;
    align-items: center;
    font-size: .8rem;
    color: var(--ink-soft);
  }
  .speak-head { display: flex; justify-content: space-between; gap: 1rem; }
  .speak-head #speakAvg { color: var(--accent); font-weight: 700; }
  .speak-result:not(:empty) {
    border-top: 1px solid var(--rule);
    margin-top: .75rem;
    padding-top: 1rem;
    text-align: center;
  }
  .speak-score {
    font-family: Georgia, serif;
    font-size: 2.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .speak-score.good { color: var(--correct); }
  .speak-score.mid { color: var(--highlight); }
  .speak-score.low { color: var(--wrong); }
  .speak-breakdown {
    font-size: .8rem;
    color: var(--ink-soft);
    margin-bottom: .75rem;
  }
  .speak-target {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.15rem;
    direction: ltr;
    margin-bottom: .75rem;
  }
  .word-ok { color: var(--correct); }
  .word-bad {
    color: var(--wrong);
    font-weight: 700;
    text-decoration: underline wavy;
    text-underline-offset: 4px;
  }
  .speak-notes {
    direction: rtl;
    text-align: right;
    font-size: .88rem;
    color: var(--wrong);
    margin: 0;
    padding: 0 1.2rem 0 0;
    line-height: 1.6;
  }
  .speak-notes.perfect { color: var(--correct); text-align: center; padding: 0; }
  .skip-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: .8rem;
    text-decoration: underline;
    cursor: pointer;
  }

  .order-label {
    font-size: .78rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 .6rem;
    direction: rtl;
  }
  .order-build {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    min-height: 3.2rem;
    padding: .75rem;
    border: 1.5px dashed var(--rule);
    border-radius: 4px;
    margin-bottom: 1.1rem;
    align-items: center;
  }
  .order-build.empty::before {
    content: "Tap the words below to build the sentence";
    color: var(--ink-soft);
    font-size: .82rem;
  }
  .order-build.correct { border-style: solid; border-color: var(--correct); }
  .order-build.wrong { border-style: solid; border-color: var(--wrong); }
  .order-bank {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .chip {
    padding: .55rem .9rem;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1rem;
    cursor: pointer;
    transition: transform .12s ease, border-color .15s, background .15s, opacity .15s;
  }
  .chip:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-2px);
  }
  .chip:active:not(:disabled) { transform: scale(.94); }
  .chip:disabled { opacity: .3; cursor: default; }
  .chip.placed {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .order-build.correct .chip.placed {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
  }
  .order-build.wrong .chip.placed {
    border-color: var(--wrong);
    background: var(--wrong-bg);
    color: var(--wrong);
  }

  .footer-row {
    margin-top: 1.5rem;
    display: flex;
    justify-content: flex-end;
  }
  button.next {
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: .65rem 1.35rem;
    border-radius: 3px;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  button.next.show { opacity: 1; pointer-events: auto; }
  button.next:focus-visible,
  .opt:focus-visible,
  button.restart:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .result { text-align: center; }
  .result .level { display: block; margin-bottom: .5rem; }
  .score {
    font-family: Georgia, serif;
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin: .25rem 0;
  }
  .result p {
    color: var(--ink-soft);
    direction: rtl;
    font-size: .95rem;
  }
  button.restart {
    margin-top: 1rem;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    padding: .65rem 1.35rem;
    border-radius: 3px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill, button.next { transition: none; }
    .mic-btn.listening { animation: none; }
  }
</style>

<div class="wrap">
  <div class="masthead">
    <h1 id="stageTitle">Question Words Drill</h1>
    <span class="level" id="levelTag">STAGE 1 / 2</span>
  </div>
  <div class="sub" id="stageSub">השלימו את מילת השאלה הנכונה — What / When / Where / Why / How / Who / Which / Whose</div>

  <div class="stage-tabs" id="stageTabs"></div>

  <div class="legend" id="legend"></div>

  <div class="sub-tabs" id="subTabs"></div>

  <div class="progress-row">
    <span>Question <strong id="qnum">1</strong> of <strong id="qtotal">15</strong></span>
    <span>Score: <strong id="scorelive">0</strong></span>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>

  <div class="card" id="quizCard"></div>
</div>

<script src="voice-chat.js"></script>
<script>
const stages = [
  {
    title: "Question Words Drill",
    sub: "השלימו את מילת השאלה הנכונה — What / When / Where / Why / How / Who / Which / Whose",
    legend: "<strong>What</strong> – מה (דבר) &nbsp;·&nbsp; <strong>Who</strong> – מי (אדם) &nbsp;·&nbsp; <strong>Where</strong> – איפה (מקום) &nbsp;·&nbsp; <strong>When</strong> – מתי (זמן) &nbsp;·&nbsp; <strong>Why</strong> – למה (סיבה) &nbsp;·&nbsp; <strong>How</strong> – איך / כמה (אופן, כמות, גיל, משך, תדירות, מחיר) &nbsp;·&nbsp; <strong>Which</strong> – איזה (בחירה מתוך אפשרויות ידועות) &nbsp;·&nbsp; <strong>Whose</strong> – של מי (בעלות)",
    mcCount: 10,
    orderCount: 10,
    dialogueGrammar: "questionWords",
    speakCount: 10,
    storyCount: 4,
    storyScenario: "A close friend of yours just got back from a week-long team-building trip in the mountains, and he has a fascinating story to tell. Ask him questions to find out all the details.",
    questions: [
      { sentence: "___ is your name?", answer: "What", options: ["What", "Who", "Where", "When"], why: "שואלים על <em>דבר</em> (השם עצמו) ולא על אדם או מקום, לכן What ולא Who." },
      { sentence: "___ do you live?", answer: "Where", options: ["Where", "What", "Why", "Who"], why: "שואלים על <em>מקום</em> המגורים, לכן Where." },
      { sentence: "___ were you late for the meeting?", answer: "Why", options: ["Why", "When", "How", "What"], why: "שואלים על <em>סיבה</em> לאיחור, לכן Why." },
      { sentence: "___ does the movie start?", answer: "When", options: ["When", "Where", "Which", "Who"], why: "שואלים על <em>זמן</em> ההתחלה, לכן When." },
      { sentence: "___ many brothers do you have?", answer: "How", options: ["How", "What", "Which", "Why"], why: "\"How many\" משמש לשאלה על <em>כמות</em> (מספר אחים), לכן How." },
      { sentence: "___ old is your grandfather?", answer: "How", options: ["How", "What", "When", "Who"], why: "\"How old\" הוא ביטוי קבוע לשאלה על <em>גיל</em>, לכן How." },
      { sentence: "___ is that man standing by the door?", answer: "Who", options: ["Who", "What", "Whose", "Which"], why: "שואלים על <em>זהות של אדם</em>, לכן Who." },
      { sentence: "___ book do you want, this one or that one?", answer: "Which", options: ["Which", "What", "Whose", "Who"], why: "יש שתי אפשרויות ידועות (הספר הזה או ההוא), ולכן משתמשים ב-Which לבחירה מתוך אפשרויות מוגבלות." },
      { sentence: "___ bag is this? It was left on the table.", answer: "Whose", options: ["Whose", "Who", "Which", "What"], why: "שואלים <em>למי שייך</em> התיק, לכן Whose (בעלות)." },
      { sentence: "___ is coming to the party tonight?", answer: "Who", options: ["Who", "Whose", "What", "Which"], why: "שואלים על <em>זהות האדם</em> שמגיע, לכן Who." },
      { type: "order", answer: ["what", "time", "is", "it"], punct: "?", why: "שואלים על <em>דבר</em> (השעה), לכן What." },
      { type: "order", answer: ["where", "is", "the", "nearest", "bank"], punct: "?", why: "שואלים על <em>מקום</em>, לכן Where." },

let stageIndex = 0;
let freeChatLogs = {};
let current = 0;
let score = 0;
let dialogueLog = {};
let dialogueLastReply = {};
let stageProgress = {};
let sectionProgress = {};
let speakScores = {};

const STORAGE_KEY = "questionWordsQuizProgress";

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ stageIndex, current, score, stageProgress, sectionProgress, speakScores }));
  } catch (e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.stageIndex === "number" && typeof data.current === "number" && typeof data.score === "number" &&
        data.stageIndex >= 0 && data.stageIndex < stages.length &&
        data.current >= 0 && data.current <= stages[data.stageIndex].questions.length) {
      stageIndex = data.stageIndex;
      current = data.current;
      score = data.score;
      if (data.stageProgress && typeof data.stageProgress === "object") {
        stageProgress = data.stageProgress;
      }
      if (data.sectionProgress && typeof data.sectionProgress === "object") {
        sectionProgress = data.sectionProgress;
      }
      if (data.speakScores && typeof data.speakScores === "object") {
        speakScores = data.speakScores;
      }
    }
  } catch (e) {}
}

// When served by local/serve.js the AI runs through its /api/dialogue route;
// otherwise paste your deployed Cloudflare Worker URL here.
const DIALOGUE_API_URL = ["localhost", "127.0.0.1"].includes(location.hostname) ? "/api/dialogue" : "";
const DIALOGUE_API_TOKEN = ""; // must match the Worker's APP_TOKEN secret

async function getDialogueResponse(stage, log, message, opts = {}) {
  if (!DIALOGUE_API_URL) return null;
  try {
    const resp = await fetch(DIALOGUE_API_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "x-app-token": DIALOGUE_API_TOKEN },
      body: JSON.stringify({
        scenario: opts.scenario || stage.storyScenario,
        grammarFocus: stage.title,
        mode: opts.mode || "guided",
        history: log.map(m => ({ who: m.who, text: m.text })),
        message
      })
    });
    if (!resp.ok) return null;
    const data = await resp.json();
    if (typeof data.grammar_ok !== "boolean" || typeof data.reply !== "string") return null;
    return { ok: data.grammar_ok, note: data.note || "", reply: data.reply };
  } catch (e) {
    return null;
  }
}

let audioCtx = null;
function playTone(freqStart, freqEnd, duration, type, gainStart) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainStart, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playCorrectSound() {
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((freq, i) => {
    setTimeout(() => playTone(freq, freq * 1.01, 0.18, "triangle", 0.2), i * 70);
  });
}

function playWrongSound() {
  playTone(220, 110, 0.32, "sawtooth", 0.15);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderTabs() {
  const tabs = document.getElementById("stageTabs");
  tabs.innerHTML = stages
    .map((s, i) => `<button class="stage-tab${i === stageIndex ? " active" : ""}" data-stage="${i}">${i + 1}. ${s.title}</button>`)
    .join("");
  tabs.querySelectorAll(".stage-tab").forEach(btn => {
    btn.addEventListener("click", () => goToStage(Number(btn.dataset.stage)));
  });
}

function goToStage(i) {
  stageProgress[stageIndex] = current;
  stageIndex = i;
  current = stageProgress[i] || 0;
  render();
}

function render() {
  VoiceChat.stop(); // leaving the card ends any live conversation
  stageProgress[stageIndex] = current;
  saveProgress();
  const card = document.getElementById("quizCard");
  const stage = stages[stageIndex];
  renderTabs();
  document.getElementById("stageTitle").textContent = stage.title;
  document.getElementById("stageSub").textContent = stage.sub;
  document.getElementById("legend").innerHTML = stage.legend;
  document.getElementById("levelTag").textContent = `STAGE ${stageIndex + 1} / ${stages.length}`;

  const sections = getSections(stage);
  if (current < stage.questions.length) {
    const activeSec = sections.find(s => current >= s.start && current < s.start + s.len) || sections[sections.length - 1];
    sectionProgress[stageIndex + ":" + activeSec.start] = current;
  }
  renderSubTabs(sections);

  if (current < stage.questions.length) {
    const sec = sections.find(s => current >= s.start && current < s.start + s.len) || sections[sections.length - 1];
    document.getElementById("qnum").textContent = current - sec.start + 1;
    document.getElementById("qtotal").textContent = sec.len;
    document.getElementById("barFill").style.width = `${((current - sec.start) / sec.len) * 100}%`;
  } else {
    document.getElementById("qnum").textContent = stage.questions.length;
    document.getElementById("qtotal").textContent = stage.questions.length;
  }
  document.getElementById("scorelive").textContent = score;

  if (current >= stage.questions.length) {
    const isLastStage = stageIndex === stages.length - 1;
    const totalQuestions = stages.reduce((sum, s) => sum + s.questions.length, 0);

    if (!isLastStage) {
      document.getElementById("levelTag").textContent = `STAGE ${stageIndex + 1} COMPLETE`;
      card.innerHTML = `
        <div class="result">
          <span class="level">Stage ${stageIndex + 1} Complete</span>
          <div>Score so far</div>
          <div class="score">${score} / ${stage.questions.length}</div>
          <p>Ready for the next stage: ${stages[stageIndex + 1].title}</p>
          <button class="restart" onclick="goToStage(${stageIndex + 1})">Next Stage →</button>
        </div>`;
      document.getElementById("barFill").style.width = "100%";
      return;
    }

    document.getElementById("levelTag").textContent = "COMPLETE";
    const verdict = score === totalQuestions
      ? "Perfect! Full mastery of all stages."
      : score >= totalQuestions * 0.7
      ? "Great job — very good performance!"
      : "Not bad — practice again to reinforce it.";
    card.innerHTML = `
      <div class="result">
        <span class="level">INTERMEDIATE</span>
        <div>You finished all the stages</div>
        <div class="score">${score} / ${totalQuestions}</div>
        <p>${verdict}</p>
        <button class="restart" onclick="restart()">Start Over</button>
      </div>`;
    document.getElementById("barFill").style.width = "100%";
    return;
  }

  const q = stage.questions[current];

  if (q.type === "order") {
    card.innerHTML = `
      <div class="order-label">Arrange the words into the correct sentence</div>
      <div class="order-build empty" id="orderBuild"></div>
      <div class="order-bank" id="orderBank"></div>
      <div class="hint" id="hint"></div>
      <div class="footer-row"><button class="next" id="nextBtn">Next →</button></div>

    renderOrderQuestion(q);
    return;
  }

  if (q.type === "translate") {
    const label = q.direction === "toHebrew" ? "Translate to Hebrew" : "Translate to English";
    const promptDir = q.direction === "toHebrew" ? "ltr" : "rtl";
    const inputDir = q.direction === "toHebrew" ? "rtl" : "ltr";
    card.innerHTML = `
      <div class="order-label">${label}</div>
      <div class="translate-prompt" dir="${promptDir}">${q.prompt}</div>
      <input type="text" class="translate-input" id="translateInput" dir="${inputDir}" autocomplete="off" spellcheck="false" />
      <div class="hint" id="hint"></div>
      <div class="footer-row"><button class="next show" id="checkBtn">Check</button></div>

    renderTranslateQuestion(q);
    return;
  }

  if (q.type === "freechat") {
    card.innerHTML = `
      <div class="dialogue-scenario">${stage.freeChat.scenario}</div>
      <div class="dialogue-cue"><strong>צ'אט חופשי:</strong> שאלו כל שאלה שבא לכם באנגלית — הדמות תענה לפי מה ששאלתם, ותקבלו משוב על הדקדוק בכל הודעה.</div>
      <div class="dialogue-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" class="translate-input" id="chatInput" dir="ltr" autocomplete="off" spellcheck="false" maxlength="300" placeholder="Ask anything in English..." />

      <div class="footer-row chat-footer"><span id="chatStats"></span><button class="next show" id="nextBtn">Finish chat →</button></div>

    return;
  }

  if (q.type === "voicechat") {
    card.innerHTML = `
      <div class="dialogue-scenario">${stage.freeChat.scenario}</div>

    VoiceChat.mount(document.getElementById("voiceChat"), {

      onFinish(talkedSeconds) {

        render();

  }

  if (q.type === "speak") {
    card.innerHTML = `
      <div class="order-label speak-head"><span>Say it in English</span><span id="speakAvg"></span></div>
      <div class="translate-prompt" dir="rtl">${q.prompt}</div>

        <div class="heard" id="heard"></div>

      <div class="speak-result" id="speakResult"></div>
      <div class="hint" id="hint"></div>
      <div class="footer-row"><button class="next" id="nextBtn">Next →</button></div>
    `;
    renderSpeakQuestion(q);
    return;
  }

  if (q.type === "dialogue") {
    const logKey = stageIndex + ":" + (q.thread || "story");
    const sec = sections.find(s => current >= s.start && current < s.start + s.len) || sections[sections.length - 1];
    if (current === sec.start) dialogueLog[logKey] = [];
    const log = dialogueLog[logKey] || [];
    const scenarioText = q.scenario || stage.storyScenario;
    const liveTurn = q.theyAsk ? [{ who: "them", text: q.theyAsk }] : [];
    card.innerHTML = `
      <div class="dialogue-scenario">${scenarioText}</div>

      <div class="hint" id="hint"></div>

  const opts = shuffle(q.options);

  card.innerHTML = `
    <div class="sentence">${q.sentence.replace("___", '<span class="blank">____</span>')}</div>
    <div class="options">
      ${opts.map(o => `<button class="opt" data-value="${o}">${o}</button>`).join("")}
    </div>
    <div class="hint" id="hint"></div>
    <div class="footer-row"><button class="next" id="nextBtn">Next →</button></div>
  `;

  card.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => selectAnswer(btn, q));
  });
}

function getSections(stage) {
  const mcCount = typeof stage.mcCount === "number" ? stage.mcCount : stage.questions.length;
  const orderCount = typeof stage.orderCount === "number" ? stage.orderCount : 0;
  const storyCount = typeof stage.storyCount === "number" ? stage.storyCount : 0;
  const speakCount = typeof stage.speakCount === "number" ? stage.speakCount : 0;
  const freeCount = stage.questions.filter(q => q.type === "freechat").length;
  const voiceCount = stage.questions.filter(q => q.type === "voicechat").length;
  const translateCount = stage.questions.length - mcCount - orderCount - speakCount - storyCount - freeCount - voiceCount;

  const sections = [];
  let pos = 0;
  if (mcCount > 0) { sections.push({ label: "Regular Questions", start: pos, len: mcCount }); pos += mcCount; }
  if (orderCount > 0) { sections.push({ label: "Word Order", start: pos, len: orderCount }); pos += orderCount; }
  if (translateCount > 0) {
    const translateQs = stage.questions.slice(pos, pos + translateCount);
    const toEnglishLen = translateQs.filter(q => q.direction === "toEnglish").length;
    const toHebrewLen = translateCount - toEnglishLen;
    if (toEnglishLen > 0) { sections.push({ label: "Hebrew → English", start: pos, len: toEnglishLen }); pos += toEnglishLen; }
    if (toHebrewLen > 0) { sections.push({ label: "English → Hebrew", start: pos, len: toHebrewLen }); pos += toHebrewLen; }
  }
  if (speakCount > 0) { sections.push({ label: "Speaking", start: pos, len: speakCount }); pos += speakCount; }
  if (storyCount > 0) { sections.push({ label: "Dialogue", start: pos, len: storyCount }); pos += storyCount; }
  if (freeCount > 0) { sections.push({ label: "Free Chat", start: pos, len: freeCount }); pos += freeCount; }
  if (voiceCount > 0) { sections.push({ label: "Voice Chat", start: pos, len: voiceCount }); pos += voiceCount; }
  return sections;
}

function renderSubTabs(sections) {
  const el = document.getElementById("subTabs");

  if (sections.length < 2) { el.innerHTML = ""; return; }

  el.innerHTML = sections.map(s => {
    const active = current >= s.start && current < s.start + s.len;
    return `<button class="sub-tab${active ? " active" : ""}" data-start="${s.start}">${s.label}</button>`;
  }).join("");
  el.querySelectorAll(".sub-tab").forEach(btn => {
    btn.onclick = () => {
      const start = Number(btn.dataset.start);
      const key = stageIndex + ":" + start;
      current = sectionProgress[key] !== undefined ? sectionProgress[key] : start;
      render();
    };
  });
}

function normalizeAnswer(str) {
  return str.trim().toLowerCase().replace(/[?.!,]/g, "").replace(/\s+/g, " ");
}

function tokenize(str) {
  return str.trim().toLowerCase().replace(/[’‘]/g, "'").replace(/[?.!,]/g, "").replace(/\s+/g, " ").split(" ").filter(Boolean);
}

const VERB_LEXICON = new Set(["like","work","works","study","studies","need","needs","walk","walks","fit","fits","live","lives","play","plays","watch","watches","eat","eats","drink","drinks","go","goes","come","comes","want","wants","know","knows","think","thinks","feel","feels","look","looks","sound","sounds","run","runs","call","calls","ask","asks","tell","tells","say","says","see","sees","do","does","make","makes","take","takes","get","gets","give","gives","find","finds","use","uses","try","tries","help","helps","start","starts","stop","stops","finish","finishes","arrive","arrives","leave","leaves","meet","meets","visit","visits","buy","buys","sell","sells","read","reads","write","writes","speak","speaks","talk","talks","listen","listens","hear","hears","understand","understands","remember","remembers","forget","forgets","believe","believes","hope","hopes","wish","wishes","plan","plans","decide","decides","choose","chooses","bring","brings","send","sends","open","opens","close","closes","turn","turns","wait","waits","stay","stays","drive","drives","fly","flies","swim","swims","cook","cooks","clean","cleans","wash","washes","sleep","sleeps","wake","wakes","dance","dances","sing","sings","paint","paints","draw","draws","build","builds","fix","fixes","break","breaks","cut","cuts","pay","pays","spend","spends","save","saves","lose","loses","win","wins","learn","learns","teach","teaches","sit","sits","stand","stands","wear","wears","carry","carries","hold","holds","push","pushes","pull","pulls","throw","throws","enjoy","enjoys","hate","hates","love","loves","prefer","prefers","travel","travels","move","moves","park","parks","ride","rides","practice","practices","exercise","exercises","shop","shops"]);

const IRREGULAR_PAST = { went:"go", saw:"see", did:"do", had:"have", was:"be", were:"be", ate:"eat", wrote:"write", came:"come", took:"take", got:"get", made:"make", said:"say", thought:"think", knew:"know", felt:"feel", left:"leave", met:"meet", ran:"run", sat:"sit", stood:"stand", spoke:"speak", drove:"drive", gave:"give", found:"find", told:"tell", bought:"buy", brought:"bring", understood:"understand", paid:"pay", sent:"send", built:"build", spent:"spend", kept:"keep", slept:"sleep", heard:"hear", held:"hold", won:"win", lost:"lose", chose:"choose", drew:"draw", flew:"fly", grew:"grow", threw:"throw", wore:"wear", broke:"break", forgot:"forget", hid:"hide", rode:"ride", rose:"rise", shook:"shake", stole:"steal", swam:"swim", taught:"teach", tore:"tear", woke:"wake" };

const THIRD_PERSON_TO_BASE = { works:"work", studies:"study", needs:"need", fits:"fit", lives:"live", plays:"play", watches:"watch", eats:"eat", drinks:"drink", goes:"go", comes:"come", wants:"want", knows:"know", thinks:"think", feels:"feel", looks:"look", sounds:"sound", runs:"run", calls:"call", asks:"ask", tells:"tell", says:"say", sees:"see", does:"do", makes:"make", takes:"take", gets:"get", gives:"give", finds:"find", uses:"use", tries:"try", helps:"help", starts:"start", stops:"stop", finishes:"finish", arrives:"arrive", leaves:"leave", meets:"meet", visits:"visit", buys:"buy", sells:"sell", reads:"read", writes:"write", speaks:"speak", talks:"talk", listens:"listen", hears:"hear", understands:"understand", remembers:"remember", forgets:"forget", believes:"believe", hopes:"hope", wishes:"wish", plans:"plan", decides:"decide", chooses:"choose", brings:"bring", sends:"send", opens:"open", closes:"close", turns:"turn", waits:"wait", stays:"stay", drives:"drive", flies:"fly", swims:"swim", cooks:"cook", cleans:"clean", washes:"wash", sleeps:"sleep", wakes:"wake", dances:"dance", sings:"sing", paints:"paint", draws:"draw", builds:"build", fixes:"fix", breaks:"break", cuts:"cut", pays:"pay", spends:"spend", saves:"save", loses:"lose", wins:"win", learns:"learn", teaches:"teach", sits:"sit", stands:"stand", wears:"wear", carries:"carry", holds:"hold", pushes:"push", pulls:"pull", throws:"throw", enjoys:"enjoy", hates:"hate", loves:"love", prefers:"prefer", travels:"travel", moves:"move", parks:"park", rides:"ride", practices:"practice", exercises:"exercise", shops:"shop" };

const QUESTION_WORDS = new Set(["what","where","when","why","how","who","which","whose"]);
const AUX_WORDS = new Set(["do","does","did","are","is","am","can","could","will","would","should","have","has","was","were"]);

function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

function isVerbLike(word) {
  if (!word) return false;
  if (VERB_LEXICON.has(word) || IRREGULAR_PAST[word]) return true;
  if (word.endsWith("ing") && word.length > 4) return true;
  if (word.endsWith("ed") && word.length > 3) return true;
  if (word.endsWith("s") && word.length > 3 && VERB_LEXICON.has(word.slice(0, -1))) return true;
  return false;
}

function findAuxIndex(tokens, maxIdx) {
  for (let i = 0; i <= Math.min(maxIdx, tokens.length - 1); i++) {
    if (AUX_WORDS.has(tokens[i])) return i;
  }
  return -1;
}

function checkAuxAgreement(tokens, auxIdx) {
  const aux = tokens[auxIdx];
  const subject = tokens[auxIdx + 1];
  if (!subject) return { ok: true };
  if (["i", "you", "we", "they"].includes(subject)) {
    if (aux === "does") return { ok: false, note: `"Does" מתאים רק לגוף שלישי יחיד (he/she/it) — עם "${subject}" צריך "Do".` };
    if (aux === "is" && ["you", "we", "they"].includes(subject)) return { ok: false, note: `"Is" לא מתאים ל-"${subject}" — צריך "Are".` };
    if (aux === "am" && subject !== "i") return { ok: false, note: `"Am" משמש רק עם "I".` };
  } else if (["he", "she", "it"].includes(subject)) {
    if (aux === "do") return { ok: false, note: `עם "${subject}" צריך "Does" ולא "Do".` };
    if (aux === "are") return { ok: false, note: `עם "${subject}" צריך "Is" ולא "Are".` };
  }
  return { ok: true };
}

const PRONOUNS = new Set(["i", "you", "he", "she", "it", "we", "they"]);

function checkQuestionWords(tokens) {
  if (!tokens.length) return { ok: false, note: "נסו לכתוב שאלה." };
  const first = tokens[0];
  if (QUESTION_WORDS.has(first)) {
    const auxIdx = findAuxIndex(tokens, 2);
    if (auxIdx === -1) {
      if (["who", "what"].includes(first) && !PRONOUNS.has(tokens[1])) return { ok: true };
      return { ok: false, note: `אחרי "${cap(first)}" צריך פועל עזר (do/does/did/are/is) לפני הנושא — למשל "${cap(first)} do you...?"` };
    }
    return checkAuxAgreement(tokens, auxIdx);
  }
  if (AUX_WORDS.has(first)) return checkAuxAgreement(tokens, 0);
  return { ok: false, note: "שאלות באנגלית בדרך כלל מתחילות במילת שאלה (What/Where/Why...) או בפועל עזר (Do/Are/Is...)." };
}

function checkDoAre(tokens) {
  const base = checkQuestionWords(tokens);
  if (!base.ok) return base;
  const auxIdx = findAuxIndex(tokens, 2);
  if (auxIdx === -1) return base;
  const aux = tokens[auxIdx];
  const subject = tokens[auxIdx + 1];
  const nextWord = tokens[auxIdx + 2];
  const thirdPerson = ["he", "she", "it"].includes(subject);
  if (["do", "does"].includes(aux) && nextWord && !isVerbLike(nextWord) && !AUX_WORDS.has(nextWord)) {
    return { ok: false, note: `אחרי "${cap(aux)}" בדרך כלל בא פועל פעולה — אם אין כאן פועל פעולה, אולי צריך "${thirdPerson ? "Is" : "Are"}" במקום.` };
  }
  if (["are", "is", "am"].includes(aux) && nextWord && isVerbLike(nextWord) && !nextWord.endsWith("ing")) {
    return { ok: false, note: `אחרי "${cap(aux)}" יש כאן מה שנראה כמו פועל פעולה ("${nextWord}") — אולי צריך "${thirdPerson ? "Does" : "Do"}" במקום.` };
  }
  return { ok: true };
}

function checkDidDo(tokens) {
  const base = checkQuestionWords(tokens);
  if (!base.ok) return base;
  const auxIdx = findAuxIndex(tokens, 2);
  if (auxIdx === -1) return base;
  const aux = tokens[auxIdx];
  const verb = tokens[auxIdx + 2];
  if (["did", "do", "does"].includes(aux) && verb) {
    if (IRREGULAR_PAST[verb]) return { ok: false, note: `אחרי "${cap(aux)}" הפועל צריך להיות בצורת הבסיס — "${IRREGULAR_PAST[verb]}" ולא "${verb}".` };
    if (THIRD_PERSON_TO_BASE[verb]) return { ok: false, note: `אחרי "${cap(aux)}" הפועל נשאר בצורת הבסיס — "${THIRD_PERSON_TO_BASE[verb]}" ולא "${verb}".` };
    if (verb.endsWith("ed") && verb.length > 3 && !VERB_LEXICON.has(verb)) return { ok: false, note: `אחרי "${cap(aux)}" הפועל נשאר בצורת הבסיס בלי "-ed" בסוף.` };
  }
  return { ok: true };
}

function checkIsAmThis(tokens) {
  if (!tokens.length) return { ok: false, note: "נסו לכתוב שאלה." };
  const first = tokens[0];
  if (!["is", "am"].includes(first)) {
    if (QUESTION_WORDS.has(first) || AUX_WORDS.has(first)) return { ok: true };
    return { ok: false, note: 'בשלב הזה מתרגלים שאלות שמתחילות ב-"Is" או "Am" — נסו זאת.' };
  }
  const subject = tokens[1];
  if (first === "am" && subject !== "i") return { ok: false, note: '"Am" משמש רק עם "I" — למשל "Am I...?"' };
  if (first === "is" && subject === "i") return { ok: false, note: 'עם "I" משתמשים ב-"Am", לא ב-"Is".' };
  return { ok: true };
}

function checkNegatives(tokens) {
  if (!tokens.length) return { ok: false, note: "נסו לכתוב משפט." };
  const joined = tokens.join(" ");
  let negIdx = tokens.findIndex(t => t === "didn't" || t === "didnt" || t === "doesn't" || t === "doesnt");
  let neg = negIdx >= 0 ? tokens[negIdx] : null;
  let twoWord = false;
  if (!neg && joined.includes("did not")) { neg = "did not"; negIdx = tokens.indexOf("did"); twoWord = true; }
  if (!neg && joined.includes("does not")) { neg = "does not"; negIdx = tokens.indexOf("does"); twoWord = true; }
  if (!neg) return { ok: false, note: `כדי לענות במשפט שלילי צריך "Didn't" (לכל הגופים, עבר) או "Doesn't" (הווה, גוף שלישי יחיד).` };
  const isDoes = neg.startsWith("doesn") || neg === "does not";
  const subject = tokens[Math.max(0, negIdx - 1)];
  if (isDoes && ["i", "you", "we", "they"].includes(subject)) {
    return { ok: false, note: `"Doesn't" מתאים רק לגוף שלישי יחיד (he/she/it) — עם "${subject}" צריך "Didn't".` };
  }
  const verbIdx = negIdx + (twoWord ? 2 : 1);
  const verb = tokens[verbIdx];
  if (verb) {
    if (IRREGULAR_PAST[verb]) return { ok: false, note: `אחרי "${neg}" הפועל צריך להיות בצורת הבסיס — "${IRREGULAR_PAST[verb]}" ולא "${verb}".` };
    if (THIRD_PERSON_TO_BASE[verb]) return { ok: false, note: `אחרי "${neg}" הפועל נשאר בצורת הבסיס — "${THIRD_PERSON_TO_BASE[verb]}" ולא "${verb}".` };
    if (verb.endsWith("ed") && verb.length > 3 && !VERB_LEXICON.has(verb)) return { ok: false, note: `אחרי "${neg}" הפועל נשאר בצורת הבסיס בלי "-ed".` };
  }
  return { ok: true };
}

function checkShortAnswers(tokens, theyAsk) {
  const answerType = tokens[0] === "no" ? "no" : "yes";
  if (!tokens.length) return { ok: false, note: 'נסו לכתוב תשובה קצרה, למשל "Yes, I do."', answerType };
  const first = tokens[0];
  if (first !== "yes" && first !== "no") return { ok: false, note: 'תשובה קצרה מתחילה ב-"Yes" או "No".', answerType };
  const subject = tokens[1];
  const auxRaw = tokens[2];
  if (!subject || !auxRaw) return { ok: false, note: 'תשובה קצרה בנויה כך: Yes/No, נושא, פועל עזר — למשל "Yes, I do."', answerType };
  const isNeg = /n't$|nt$/.test(auxRaw);
  const aux = auxRaw.replace(/n't$|nt$/, "");
  if (!["do", "does", "did"].includes(aux)) return { ok: false, note: `התשובה צריכה פועל עזר: do / does / did (בשלילה: don't / doesn't / didn't).`, answerType };
  if (first === "no" && !isNeg) return { ok: false, note: `עם "No" צריך צורה שלילית (don't / doesn't / didn't).`, answerType };
  if (first === "yes" && isNeg) return { ok: false, note: `עם "Yes" לא משתמשים בצורה השלילית.`, answerType };
  if (aux === "does" && ["i", "you", "we", "they"].includes(subject)) return { ok: false, note: `"Does" מתאים רק לגוף שלישי יחיד — עם "${subject}" צריך "Do".`, answerType };
  if (aux === "do" && ["he", "she", "it"].includes(subject)) return { ok: false, note: `עם "${subject}" צריך "Does" ולא "Do".`, answerType };
  if (theyAsk) {
    const qAux = tokenize(theyAsk)[0];
    if (["do", "does", "did"].includes(qAux) && qAux !== aux) return { ok: false, note: `השאלה נשאלה עם "${cap(qAux)}" — התשובה הקצרה צריכה להשתמש באותו פועל עזר.`, answerType };
  }
  return { ok: true, answerType };
}

const GRAMMAR_CHECKERS = {
  questionWords: checkQuestionWords,
  doAre: checkDoAre,
  didDo: checkDidDo,
  isAmThis: checkIsAmThis,
  negatives: checkNegatives,
  shortAnswers: checkShortAnswers
};

function renderTranslateQuestion(q) {
  const input = document.getElementById("translateInput");
  const btn = document.getElementById("checkBtn");

  function check() {
    const userVal = normalizeAnswer(input.value);
    const isCorrect = q.answers.some(a => normalizeAnswer(a) === userVal);
    input.disabled = true;
    input.classList.add(isCorrect ? "correct" : "wrong");
    document.getElementById("hint").innerHTML = isCorrect
      ? `Correct! <strong>${q.display}</strong>`
      : `Not quite — a correct answer is: <strong>${q.display}</strong>`;

    if (isCorrect) { score++; playCorrectSound(); }
    else { playWrongSound(); }
    document.getElementById("scorelive").textContent = score;
    saveProgress();

    btn.textContent = "Next →";
    btn.onclick = () => { current++; render(); };
  }

  btn.onclick = check;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") check();
  });
  input.focus();
}

function escapeAttr(s) {
  return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function renderDialogueLog(log) {
  return log.map(m => `<div class="dialogue-msg ${m.who}">${m.text} <button class="speak-btn" onclick="speak(this.dataset.text)" data-text="${escapeAttr(m.text)}" title="Listen" aria-label="Listen">🔊</button></div>`).join("");
}

function formatUserLine(raw, isStatement) {
  let t = raw.trim().replace(/\s+/g, " ");
  if (!t) return t;
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.?!]$/.test(t)) t += isStatement ? "." : "?";
  return t;
}

function pickReply(stage) {
  const pool = stage.dialogueReplies || [];
  if (!pool.length) return null;
  let idx = Math.floor(Math.random() * pool.length);
  if (pool.length > 1 && idx === dialogueLastReply[stageIndex]) idx = (idx + 1) % pool.length;
  dialogueLastReply[stageIndex] = idx;
  return pool[idx];
}

function renderFreeChatLog(log) {
  return log.map(m => {
    const bubble = `<div class="dialogue-msg ${m.who}">${escapeHtml(m.text)} <button class="speak-btn" onclick="speak(this.dataset.text)" data-text="${escapeAttr(m.text)}" title="Listen" aria-label="Listen">🔊</button></div>`;
    if (m.who !== "you" || m.ok === undefined) return bubble;
    const note = m.ok
      ? `<div class="chat-note ok">✓ Grammar looks good</div>`
      : `<div class="chat-note bad">✗ ${escapeHtml(m.note || "יש כאן טעות דקדוק.")}</div>`;
    return bubble + note;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderFreeChat(stage) {
  const logKey = String(stageIndex);
  const log = freeChatLogs[logKey] || (freeChatLogs[logKey] = []);
  const logEl = document.getElementById("chatLog");
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("chatSend");
  const micBtn = document.getElementById("chatMic");
  const hint = document.getElementById("hint");
  const stats = document.getElementById("chatStats");
  const nextBtn = document.getElementById("nextBtn");
  let busy = false;

  function grammarPercent() {
    const mine = log.filter(m => m.who === "you" && m.ok !== undefined);
    if (!mine.length) return null;
    return Math.round(100 * mine.filter(m => m.ok).length / mine.length);
  }

  function draw() {
    logEl.innerHTML = renderFreeChatLog(log);
    const sent = log.filter(m => m.who === "you").length;
    const g = grammarPercent();
    stats.textContent = sent ? `Messages: ${sent} · Grammar: ${g}%` : "";
    logEl.lastElementChild && logEl.lastElementChild.scrollIntoView({ block: "nearest" });
  }

  if (!DIALOGUE_API_URL) {
    input.disabled = sendBtn.disabled = micBtn.disabled = true;
    hint.innerHTML = `<span class="why">הצ'אט החופשי צריך חיבור לשרת ה-AI (Cloudflare Worker), והוא עדיין לא מוגדר.</span>`;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    input.value = "";
    input.disabled = sendBtn.disabled = true;
    const history = log.slice();
    const entry = { who: "you", text: formatUserLine(text, !/^(what|where|when|why|how|who|which|whose|do|does|did|is|are|am|was|were|can|could|will|would|should|have|has)\b/i.test(text)) };
    log.push(entry);
    draw();
    hint.textContent = "…";

    const ai = await getDialogueResponse(stage, history, text, { scenario: stage.freeChat.scenario, mode: "free" });
    busy = false;
    input.disabled = sendBtn.disabled = false;
    input.focus();
    if (!ai) {
      log.pop();
      input.value = text;
      draw();
      hint.innerHTML = `<span class="why">לא הצלחתי לקבל תשובה מהשרת — בדקו את החיבור לאינטרנט ונסו שוב.</span>`;
      return;
    }
    entry.ok = ai.ok;
    entry.note = ai.note;
    log.push({ who: "them", text: ai.reply });
    if (ai.ok) playCorrectSound(); else playWrongSound();
    hint.textContent = "";
    draw();
  }

  sendBtn.onclick = send;
  input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  if (SpeechRecognitionCtor) {
    let rec = null;
    micBtn.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = new SpeechRecognitionCtor();
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.onresult = e => { input.value = e.results[0][0].transcript; input.focus(); };
      rec.onend = () => { rec = null; micBtn.classList.remove("listening"); };
      try { rec.start(); micBtn.classList.add("listening"); } catch (e) { rec = null; }
    };
  } else {
    micBtn.style.display = "none";
  }

  nextBtn.onclick = () => {
    const sent = log.filter(m => m.who === "you" && m.ok !== undefined).length;
    const g = grammarPercent();
    if (sent >= FREE_CHAT_PASS_MESSAGES && g >= FREE_CHAT_PASS_GRAMMAR) { score++; saveProgress(); }
    current++;
    render();
  };

  draw();
  if (!input.disabled) input.focus();
}

function renderDialogueQuestion(q, stage, logKey) {
  const input = document.getElementById("translateInput");
  const btn = document.getElementById("checkBtn");

  async function check() {
    const raw = input.value;
    if (!raw.trim()) { input.focus(); return; }
    input.disabled = true;
    btn.disabled = true;
    document.getElementById("hint").textContent = DIALOGUE_API_URL ? "…" : "";

    const log = dialogueLog[logKey] || (dialogueLog[logKey] = []);
    const aiResult = await getDialogueResponse(stage, log, raw);

    let result, reply;
    if (aiResult) {
      result = { ok: aiResult.ok, note: aiResult.note };
      reply = aiResult.reply;
    } else {
      const tokens = tokenize(raw);
      const checker = GRAMMAR_CHECKERS[stage.dialogueGrammar];
      result = checker ? checker(tokens, q.theyAsk) : { ok: true };
      reply = (q.yesReply || q.noReply) ? (result.answerType === "no" ? q.noReply : q.yesReply) : (q.reply || pickReply(stage));
    }

    btn.disabled = false;
    input.classList.add(result.ok ? "correct" : "wrong");
    document.getElementById("hint").innerHTML = result.ok
      ? "Looks good!"
      : `Grammar note: ${result.note}`;

    if (result.ok) { score++; playCorrectSound(); }
    else { playWrongSound(); }
    document.getElementById("scorelive").textContent = score;
    saveProgress();

    btn.textContent = "Next →";
    btn.onclick = () => {
      log.push({ who: "you", text: formatUserLine(raw, !!q.theyAsk) });
      if (reply) log.push({ who: "them", text: reply });
      current++;
      render();
    };
  }

  btn.onclick = check;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") check();
  });
  input.focus();
}

const SPEAK_MAX_TRIES = 3;
const SPEAK_PASS = 80;
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
// Hands-free: one tap turns the mic on and it keeps listening between tries
// and across speaking questions until tapped off.
let micHandsFree = false;
const MIC_RESTART_DELAY = 700;

function normalizeSpoken(str) {
  return str.toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/[?.!,]/g, "")
    .replace(/\b(did|does|do|is|are|was|were)nt\b/g, "$1n't")
    .replace(/\bcan't\b/g, "can not")
    .replace(/\bwon't\b/g, "will not")
    .replace(/n't\b/g, " not")
    .replace(/'m\b/g, " am")
    .replace(/'re\b/g, " are")
    .replace(/\b(he|she|it|that|this|what|where|who|how|there|here)'s\b/g, "$1 is")
    .replace(/\s+/g, " ")
    .trim();
}

function sameWord(a, b) {
  return a.replace(/'/g, "") === b.replace(/'/g, "");
}

// Word-level edit distance, plus the list of edits (match / sub / del / ins)
function wordDiff(target, said) {
  const n = target.length, m = said.length;
  const d = Array.from({ length: n + 1 }, (_, i) => Array.from({ length: m + 1 }, (_, j) => i + j));
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      const cost = sameWord(target[i - 1], said[j - 1]) ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j - 1] + cost, d[i - 1][j] + 1, d[i][j - 1] + 1);
    }
  }
  const ops = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (sameWord(target[i - 1], said[j - 1]) ? 0 : 1)) {
      ops.unshift({ op: sameWord(target[i - 1], said[j - 1]) ? "match" : "sub", target: target[i - 1], said: said[j - 1] });
      i--; j--;
    } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) {
      ops.unshift({ op: "del", target: target[i - 1] });
      i--;
    } else {
      ops.unshift({ op: "ins", said: said[j - 1] });
      j--;
    }
  }
  return { dist: d[n][m], ops };
}

function charDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1), d[i - 1][j] + 1, d[i][j - 1] + 1);
    }
  }
  return d[a.length][b.length];
}

// Words = share of the sentence said correctly. Pronunciation = how confidently
// the recognizer understood you (Web Speech has no per-sound scoring).
function evaluateSpeech(alts, answers) {
  let best = null;
  alts.forEach((alt, altIdx) => {
    const said = normalizeSpoken(alt.transcript).split(" ").filter(Boolean);
    answers.forEach(ans => {
      const target = normalizeSpoken(ans).split(" ");
      const { dist, ops } = wordDiff(target, said);
      const accuracy = Math.max(0, 1 - dist / target.length);
      if (!best || accuracy > best.accuracy) best = { accuracy, ops, altIdx, transcript: alt.transcript };
    });
  });
  const conf = alts[0].confidence;
  let pron = null;
  if (typeof conf === "number" && conf > 0) {
    pron = Math.min(1, Math.max(0, (conf - 0.5) / 0.42));
    if (best.altIdx > 0) pron *= 0.85;
  }
  const percent = Math.round(100 * best.accuracy * (pron === null ? 1 : 0.7 + 0.3 * pron));
  return { ...best, pron, percent };
}

const GRAMMAR_WORDS = new Set(["do", "does", "did", "is", "are", "am", "was", "were", "not", "a", "an", "the"]);

function speakFeedback(result) {
  const notes = [];
  if (result.accuracy < 0.4) {
    notes.push("זה לא התרגום של המשפט — הקשיבו לתשובה הנכונה ונסו שוב.");
  } else {
    result.ops.forEach(o => {
      if (o.op === "sub") {
        if (GRAMMAR_WORDS.has(o.target) || GRAMMAR_WORDS.has(o.said)) {
          notes.push(`טעות דקדוק: אמרת "${o.said}" במקום "${o.target}".`);
        } else if (o.target[0] === o.said[0] && charDistance(o.target, o.said) <= Math.max(1, Math.round(o.target.length / 2))) {
          notes.push(`אמרת "${o.said}" במקום "${o.target}" — המילים דומות, כנראה בעיית הגייה. הקשיבו ל-"${o.target}" ונסו שוב.`);
        } else {
          notes.push(`אמרת "${o.said}" במקום "${o.target}".`);
        }
      } else if (o.op === "del") {
        notes.push(`חסרה המילה "${o.target}".`);
      } else if (o.op === "ins") {
        notes.push(`מילה מיותרת: "${o.said}".`);
      }
    });
  }
  if (result.pron === null) {
    notes.push("הדפדפן הזה לא מחזיר נתוני הגייה, אז הציון מבוסס רק על המילים.");
  } else if (result.accuracy >= 0.4 && result.pron < 0.6) {
    notes.push("ההגייה לא הייתה מספיק ברורה — לחצו 🔊, הקשיבו איך אומרים את המשפט, ונסו שוב לאט ובבירור.");
  }
  return notes;
}

function renderDiffWords(ops) {
  return ops.filter(o => o.op !== "ins").map((o, i) => {
    const w = i === 0 ? cap(o.target) : o.target;
    return `<span class="${o.op === "match" ? "word-ok" : "word-bad"}">${w}</span>`;
  }).join(" ");
}

function speakAverage() {
  const vals = stages[stageIndex].questions
    .map((q, i) => q.type === "speak" ? speakScores[stageIndex + ":" + i] : undefined)
    .filter(v => typeof v === "number");
  if (!vals.length) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

function renderSpeakQuestion(q) {
  const micBtn = document.getElementById("micBtn");
  const status = document.getElementById("speakStatus");
  const heard = document.getElementById("heard");
  const result = document.getElementById("speakResult");
  const hint = document.getElementById("hint");
  const nextBtn = document.getElementById("nextBtn");
  const key = stageIndex + ":" + current;
  const avg = speakAverage();
  document.getElementById("speakAvg").textContent = avg === null ? "" : `Speaking average: ${avg}%`;
  let tries = 0;
  let bestPercent = 0;
  let done = false;
  let recognition = null;

  const skip = document.createElement("button");
  skip.className = "skip-link";
  skip.textContent = "Show answer";
  status.after(skip);

  function finish() {
    if (done) return;
    done = true;
    skip.remove();
    micBtn.disabled = true;
    micBtn.classList.remove("listening");
    if (recognition) recognition.abort();
    speakScores[key] = bestPercent;
    if (bestPercent >= SPEAK_PASS) score++;
    document.getElementById("scorelive").textContent = score;
    saveProgress();
    hint.innerHTML = `Final score: <strong>${bestPercent}%</strong> · The answer: <strong>${q.display}</strong> <button class="speak-btn" onclick="speak(this.dataset.text)" data-text="${escapeAttr(q.display)}" title="Listen" aria-label="Listen">🔊</button>`;
    nextBtn.classList.add("show");
    nextBtn.onclick = () => { current++; render(); };
  }

  nextBtn.onclick = () => { finish(); current++; render(); };

  skip.onclick = () => {
    if (!tries) playWrongSound();
    finish();
  };

  if (!SpeechRecognitionCtor) {
    micBtn.disabled = true;
    status.innerHTML = "זיהוי דיבור לא נתמך בדפדפן הזה — פתחו את האפליקציה ב-Chrome או Edge.";
    return;
  }

  micBtn.onclick = () => {
    if (done) return;
    if (recognition || micHandsFree) {
      micHandsFree = false;
      if (recognition) recognition.stop();
      else micBtn.classList.remove("listening");
      return;
    }
    micHandsFree = true;
    startListening();
  };

  function startListening() {
    if (done || recognition || !micBtn.isConnected) return;
    recognition = new SpeechRecognitionCtor();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 5;

    recognition.onresult = e => {
      const alts = Array.from(e.results[0]).map(a => ({ transcript: a.transcript, confidence: a.confidence }));
      const r = evaluateSpeech(alts, q.answers);
      tries++;
      bestPercent = Math.max(bestPercent, r.percent);
      heard.textContent = `You said: "${r.transcript.trim()}"`;
      const level = r.percent >= SPEAK_PASS ? "good" : r.percent >= 50 ? "mid" : "low";
      const notes = speakFeedback(r);
      const pronLine = r.pron === null ? "" : ` · Pronunciation: ${Math.round(r.pron * 100)}%`;
      result.innerHTML = `
        <div class="speak-score ${level}">${r.percent}%</div>
        <div class="speak-breakdown">Words: ${Math.round(r.accuracy * 100)}%${pronLine}</div>
        <div class="speak-target">${renderDiffWords(r.ops)}</div>
        ${notes.length ? `<ul class="speak-notes">${notes.map(n => `<li>${n}</li>`).join("")}</ul>` : `<div class="speak-notes perfect">מושלם! 🎉</div>`}`;
      if (r.percent >= SPEAK_PASS) playCorrectSound(); else playWrongSound();

      if (r.percent >= 95 || tries >= SPEAK_MAX_TRIES) { finish(); return; }
      const left = SPEAK_MAX_TRIES - tries;
      status.textContent = `Try again to improve your score (${left} ${left === 1 ? "try" : "tries"} left) — or press Next`;
      nextBtn.classList.add("show");
    };
    recognition.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        micHandsFree = false;
        status.textContent = "צריך לאשר גישה למיקרופון בדפדפן כדי לתרגל דיבור.";
      } else if (e.error === "no-speech" && micHandsFree) {
        // Silence timeout — onend restarts listening.
      } else if (e.error === "network") {
        micHandsFree = false;
        status.textContent = "זיהוי הדיבור צריך חיבור לאינטרנט.";
      } else if (e.error === "no-speech") {
        status.textContent = "Didn't hear anything — tap the mic and try again.";
      } else if (e.error !== "aborted") {
        micHandsFree = false;
        status.textContent = "Something went wrong — tap the mic and try again.";
      }
    };
    recognition.onend = () => {
      recognition = null;
      if (micHandsFree && !done && micBtn.isConnected) {
        // Short pause so the feedback sound isn't picked up as speech.
        setTimeout(startListening, MIC_RESTART_DELAY);
        return;
      }
      micBtn.classList.remove("listening");
      if (!done && status.textContent.startsWith("Listening…")) status.textContent = "Tap the mic and say the sentence in English";
    };

    try {
      recognition.start();
      micBtn.classList.add("listening");
      if (!tries) status.textContent = "Listening… (tap the mic to turn it off)";
    } catch (e) {
      recognition = null;
    }
  }

  if (micHandsFree) startListening();
}

function renderOrderQuestion(q) {
  let placed = [];
  const shuffled = shuffle(q.answer.map((w, i) => ({ w, i })));
  if (q.answer.length > 1 && shuffled.every((item, idx) => item.i === idx)) {
    [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
  }

  function draw() {
    const buildEl = document.getElementById("orderBuild");
    const bankEl = document.getElementById("orderBank");
    buildEl.classList.toggle("empty", placed.length === 0);
    buildEl.innerHTML = placed.map(p => `<button class="chip placed" data-i="${p.i}">${p.w}</button>`).join("");
    bankEl.innerHTML = shuffled.map(item => {
      const used = placed.some(p => p.i === item.i);
      return `<button class="chip" data-i="${item.i}" ${used ? "disabled" : ""}>${item.w}</button>`;
    }).join("");

    buildEl.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        placed = placed.filter(p => p.i !== Number(btn.dataset.i));
        draw();
      });
    });
    bankEl.querySelectorAll(".chip:not(:disabled)").forEach(btn => {
      btn.addEventListener("click", () => {
        placed.push(shuffled.find(s => s.i === Number(btn.dataset.i)));
        draw();
        if (placed.length === q.answer.length) checkOrder();
      });
    });
  }

  function checkOrder() {
    const buildEl = document.getElementById("orderBuild");
    const userOrder = placed.map(p => p.w);
    const isCorrect = JSON.stringify(userOrder) === JSON.stringify(q.answer);
    buildEl.classList.add(isCorrect ? "correct" : "wrong");
    buildEl.querySelectorAll(".chip").forEach(b => b.disabled = true);
    document.getElementById("orderBank").querySelectorAll(".chip").forEach(b => b.disabled = true);

    const sentence = q.answer.join(" ");
    const proper = sentence.charAt(0).toUpperCase() + sentence.slice(1) + q.punct;
    document.getElementById("hint").innerHTML = isCorrect
      ? `Correct! <strong>${proper}</strong>`
      : `Almost — the correct order is: <strong>${proper}</strong>${q.why ? `<span class="why">${q.why}</span>` : ""}`;

    if (isCorrect) { score++; playCorrectSound(); }
    else { playWrongSound(); }
    document.getElementById("scorelive").textContent = score;
    saveProgress();
    document.getElementById("nextBtn").classList.add("show");
    document.getElementById("nextBtn").onclick = () => {
      current++;
      render();
    };
  }

  draw();
}

function selectAnswer(btn, q) {
  const correctAnswer = q.answer;
  const buttons = document.querySelectorAll(".opt");
  const isCorrect = btn.dataset.value === correctAnswer;

  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.value === correctAnswer) b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
  });

  document.getElementById("hint").innerHTML = isCorrect
    ? "Correct!"
    : `Not quite — the correct answer is "${correctAnswer}".<span class="why">${q.why}</span>`;

  if (isCorrect) {
    score++;
    playCorrectSound();
  } else {
    playWrongSound();
  }
  document.getElementById("scorelive").textContent = score;
  saveProgress();
  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("nextBtn").onclick = () => {
    current++;
    render();
  };
}

function restart() {
  stageIndex = 0;
  current = 0;
  score = 0;
  stageProgress = {};
  sectionProgress = {};
  speakScores = {};
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  render();
}

loadProgress();
render();
</script>
